name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  backend-gflowx:
    name: backend (patch + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Apply gflowx-router backend patch
        run: git -C backend am "${{ github.workspace }}/patches/0001-feat-gflowx-scene-tag-to-model-resolution-before-rel.patch"

      - name: Go test (gflowxscene)
        working-directory: backend
        run: go test ./gflowxscene/...

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & lint & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
