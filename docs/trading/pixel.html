<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const S = 0.01;
const WALK_SPEED = 2.8;
const WORLD = { W: 48, H: 27, MID_X: 24, MID_Y: 13.5 };

const AGENTS = {
  xau: { name: 'XAU Agent', color: '#FFD700', icon: '🥇', desc: '黄金趋势交易 — 结构突破 + EMA 趋势跟踪', strategy: '趋势跟踪', market: '黄金(XAUUSDT)', interval: '15m/1h/4h', risk: '中' },
  major: { name: 'Major Agent', color: '#3B82F6', icon: '₿', desc: '主流币趋势交易 — BTC/ETH 等大市值币种', strategy: '趋势跟踪 + 反转', market: 'BTC/ETH 等主流币', interval: '1h/4h', risk: '中' },
  altcoin: { name: 'Altcoin Agent', color: '#F59E0B', icon: '🪙', desc: '山寨币波段交易 — 动量与均值回归', strategy: '波段 + 动量', market: 'Alt 山寨币', interval: '15m/1h', risk: '中高' },
  newcoin: { name: 'Newcoin Agent', color: '#A855F7', icon: '🚀', desc: '新币猎手 — 新上线代币的早期趋势捕捉', strategy: '趋势突破', market: '新上线代币', interval: '5m/15m', risk: '高' },
  momentum: { name: 'Momentum Agent', color: '#EF4444', icon: '⚡', desc: '动量策略 — 强势品种追涨杀跌', strategy: '动量追踪', market: '高波动品种', interval: '5m/15m', risk: '高' },
};

function p2(x, y) { return { x: x * S, z: y * S }; }

const OfficePath = {
  nodes: {
    a_w: p2(220,780), a_xau: p2(420,780), a_maj: p2(700,780), a_alt: p2(980,780),
    a_new: p2(1260,780), a_mom: p2(1540,780), a_e: p2(2180,780),
    desk_xau: p2(420,560), desk_maj: p2(700,560), desk_alt: p2(980,560),
    desk_new: p2(1260,560), desk_mom: p2(1540,560),
    u_w: p2(220,420), u_xau: p2(420,420), u_maj: p2(700,420), u_alt: p2(980,420),
    u_new: p2(1260,420), u_mom: p2(1540,420), u_e: p2(2180,420),
    scr_xau: p2(420,170), scr_maj: p2(700,170), scr_alt: p2(980,170),
    scr_new: p2(1260,170), scr_mom: p2(1540,170), scr_ctr: p2(1200,130),
    d_w: p2(220,980), d_xau: p2(420,980), d_maj: p2(700,980), d_alt: p2(980,980),
    d_new: p2(1260,980), d_mom: p2(1540,980), d_e: p2(2180,980),
    rest_door_l: p2(560,1055), rest_door_r: p2(1340,1055),
    rest_l_1: p2(420,1265), rest_l_2: p2(560,1278), rest_l_3: p2(700,1265),
    rest_r_1: p2(1240,1265), rest_r_2: p2(1440,1278),
    door_ts: p2(2390,780), door_tr: p2(1200,1350), door_sc: p2(3600,1350),
    door_rc: p2(2390,2000), hub_tr: p2(1200,1160), v_sc: p2(3600,1080), h_rc: p2(1920,2000),
    spa_w: p2(2580,780), spa_c: p2(3000,780), spa_e: p2(3420,780), spa_d: p2(3000,1050),
    bed_1: p2(2700,1180), bed_2: p2(3000,1180), bed_3: p2(3300,1180),
    bed_4: p2(2850,980), bed_5: p2(3150,980),
    rest_w: p2(480,1480), rest_c: p2(1200,1480), rest_e: p2(1920,1480), rest_d: p2(1200,1580),
    dine_1: p2(700,1850), dine_2: p2(1200,1850), dine_3: p2(1700,1850),
    dine_4: p2(700,2150), dine_5: p2(1700,2150),
    cas_w: p2(2880,1480), cas_c: p2(3600,1480), cas_e: p2(4320,1480), cas_d: p2(3600,1580),
    poker_1: p2(3300,2050), poker_2: p2(3600,2180), poker_3: p2(3900,2050),
    poker_4: p2(3420,2320), poker_5: p2(3780,2320),
  },
  deskByAgent: { xau:'desk_xau', major:'desk_maj', altcoin:'desk_alt', newcoin:'desk_new', momentum:'desk_mom' },
  boothByAgent: { xau:'rest_l_1', major:'rest_l_2', altcoin:'rest_l_3', newcoin:'rest_r_1', momentum:'rest_r_2' },
  massageByAgent: { xau:'bed_1', major:'bed_2', altcoin:'bed_3', newcoin:'bed_4', momentum:'bed_5' },
  dineByAgent: { xau:'dine_1', major:'dine_2', altcoin:'dine_3', newcoin:'dine_4', momentum:'dine_5' },
  pokerByAgent: { xau:'poker_1', major:'poker_2', altcoin:'poker_3', newcoin:'poker_4', momentum:'poker_5' },
  wanderTargets: ['desk_xau','desk_maj','desk_alt','scr_ctr','rest_l_1','bed_1','dine_2','poker_3'],
  _edges: null,
  _buildEdges() {
    if (this._edges) return this._edges;
    const pairs = [
      ['a_w','a_xau'],['a_xau','a_maj'],['a_maj','a_alt'],['a_alt','a_new'],['a_new','a_mom'],['a_mom','a_e'],
      ['u_w','u_xau'],['u_xau','u_maj'],['u_maj','u_alt'],['u_alt','u_new'],['u_new','u_mom'],['u_mom','u_e'],
      ['d_w','d_xau'],['d_xau','d_maj'],['d_maj','d_alt'],['d_alt','d_new'],['d_new','d_mom'],['d_mom','d_e'],
      ['d_xau','rest_door_l'],['d_maj','rest_door_l'],['d_alt','rest_door_l'],
      ['d_new','rest_door_r'],['d_mom','rest_door_r'],
      ['rest_door_l','rest_l_1'],['rest_door_l','rest_l_2'],['rest_door_l','rest_l_3'],
      ['rest_door_r','rest_r_1'],['rest_door_r','rest_r_2'],
      ['desk_xau','a_xau'],['desk_maj','a_maj'],['desk_alt','a_alt'],['desk_new','a_new'],['desk_mom','a_mom'],
      ['a_xau','u_xau'],['a_maj','u_maj'],['a_alt','u_alt'],['a_new','u_new'],['a_mom','u_mom'],
      ['a_xau','d_xau'],['a_maj','d_maj'],['a_alt','d_alt'],['a_new','d_new'],['a_mom','d_mom'],
      ['u_xau','scr_xau'],['u_maj','scr_maj'],['u_alt','scr_alt'],['u_new','scr_new'],['u_mom','scr_mom'],
      ['u_maj','scr_ctr'],['u_alt','scr_ctr'],['u_new','scr_ctr'],
      ['a_e','door_ts'],['door_ts','spa_w'],['spa_w','spa_c'],['spa_c','spa_e'],
      ['spa_c','spa_d'],['spa_d','bed_1'],['spa_d','bed_2'],['spa_d','bed_3'],['spa_e','bed_4'],['spa_e','bed_5'],
      ['d_maj','hub_tr'],['d_alt','hub_tr'],['d_xau','hub_tr'],['hub_tr','door_tr'],
      ['door_tr','rest_d'],['rest_d','rest_c'],['rest_w','rest_c'],['rest_c','rest_e'],
      ['rest_c','dine_1'],['rest_c','dine_2'],['rest_c','dine_3'],['rest_w','dine_4'],['rest_e','dine_5'],
      ['spa_e','v_sc'],['v_sc','door_sc'],['door_sc','cas_d'],['cas_d','cas_c'],
      ['cas_w','cas_c'],['cas_c','cas_e'],
      ['cas_c','poker_1'],['cas_c','poker_2'],['cas_c','poker_3'],['cas_w','poker_4'],['cas_e','poker_5'],
      ['rest_e','h_rc'],['h_rc','door_rc'],['door_rc','cas_w'],
    ];
    const adj = {};
    Object.keys(this.nodes).forEach(k => { adj[k] = []; });
    pairs.forEach(([a,b]) => { if (adj[a] && adj[b]) { adj[a].push(b); adj[b].push(a); } });
    this._edges = adj;
    return adj;
  },
  nearestNode(x, z) {
    let best = null, bestD = Infinity;
    Object.entries(this.nodes).forEach(([id, n]) => {
      const d = (n.x - x) ** 2 + (n.z - z) ** 2;
      if (d < bestD) { bestD = d; best = id; }
    });
    return best;
  },
  findPath(fromId, toId) {
    if (fromId === toId) return [this.nodes[toId]];
    const adj = this._buildEdges();
    const q = [[fromId]], seen = new Set([fromId]);
    while (q.length) {
      const path = q.shift(), cur = path[path.length - 1];
      for (const nb of adj[cur] || []) {
        if (seen.has(nb)) continue;
        seen.add(nb);
        const np = path.concat([nb]);
        if (nb === toId) return np.map(id => ({ x: this.nodes[id].x, z: this.nodes[id].z }));
        q.push(np);
      }
    }
    return [this.nodes[toId]];
  },
  pathToNode(x, z, nodeId) {
    return this.findPath(this.nearestNode(x, z), nodeId);
  },
};

// ── Gugugaga 粘土风 Chibi 企鹅二创 ──
function clayMat(color, roughness = 0.78, metalness = 0.04) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function createGugugaga(accentColor) {
  const g = new THREE.Group();
  g.name = 'gugugaga';

  const skin = clayMat(0xffdfc8);
  const black = clayMat(0x1a1a1a);
  const white = clayMat(0xf8f8f8);
  const yellow = clayMat(0xffc832, 0.65);
  const silver = clayMat(0xc0c8d0, 0.35, 0.55);
  const blueEye = clayMat(0x4a9eff, 0.4, 0.1);
  const amberEye = clayMat(0xffaa33, 0.4, 0.1);
  const accent = clayMat(new THREE.Color(accentColor));

  // 企鹅连体衣 — 白色圆肚
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 28, 28), white);
  belly.scale.set(1, 1.05, 0.88);
  belly.position.y = 0.52;
  belly.castShadow = true;
  g.add(belly);

  // 黑色背部/企鹅帽
  const back = new THREE.Mesh(new THREE.SphereGeometry(0.44, 28, 28, 0, Math.PI * 2, 0, Math.PI * 0.62), black);
  back.position.set(0, 0.58, -0.06);
  back.rotation.x = 0.15;
  back.castShadow = true;
  g.add(back);

  // 企鹅帽尖 + 黄色小冠
  const hoodTip = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.22, 12), black);
  hoodTip.position.set(0, 1.05, -0.08);
  hoodTip.rotation.x = -0.3;
  g.add(hoodTip);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), yellow);
  crown.position.set(0, 1.18, -0.06);
  g.add(crown);

  // 脸部（从帽口露出）
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), skin);
  face.position.set(0, 0.82, 0.18);
  face.castShadow = true;
  g.add(face);

  // 黑色短发
  const hairL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), black);
  hairL.position.set(-0.22, 0.95, 0.08);
  hairL.scale.set(0.8, 1, 0.7);
  g.add(hairL);
  const hairR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), black);
  hairR.position.set(0.2, 0.98, 0.05);
  hairR.scale.set(0.7, 0.9, 0.6);
  g.add(hairR);

  g.userData.parts = { wingL, wingR, belly, footL, footR };

}

function makeLabel(name, color) {
  const el = document.createElement('div');
  el.className = 'char-label';
  el.innerHTML = '<span style="color:' + color + '">' + name + '</span><span class="status">空闲</span>';
  return new CSS2DObject(el);
}

function addBox(parent, w, h, d, color, x, y, z, rx = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), clayMat(color));
  m.position.set(x, y, z);
  m.rotation.y = rx;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function addZoneLabel(text, x, z, color = '#4a3f35') {
  const el = document.createElement('div');
  el.style.cssText = 'padding:6px 14px;border-radius:10px;font-size:13px;font-weight:700;background:rgba(255,252,247,0.92);color:' + color + ';border:1px solid #d4c8b8;pointer-events:none;';
  el.textContent = text;
  const obj = new CSS2DObject(el);
  obj.position.set(x, 3.5, z);
  return obj;
}

// ── Agent Profile UI ──
const AgentProfile = {
  API: location.origin + '/trading',
  currentAgent: null, schema: [], config: {},
  init() {
    document.querySelectorAll('#agent-detail .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => this.switchTab(btn.dataset.tab));
    });
    document.getElementById('config-save').addEventListener('click', () => this.saveConfig());
    document.getElementById('soul-save').addEventListener('click', () => this.saveSoul());
    document.getElementById('detail-close').addEventListener('click', () => {
      document.getElementById('agent-detail').classList.remove('active');
      world.selectedAgentId = null;
    });
  },
  switchTab(tab) {
    document.querySelectorAll('#agent-detail .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    ['overview','config','soul'].forEach(t => document.getElementById('tab-' + t).classList.toggle('active', t === tab));
  },
  load(agentId) {
    this.currentAgent = agentId;
    this.switchTab('overview');
    document.getElementById('config-msg').textContent = '';
    document.getElementById('soul-msg').textContent = '';
    fetch(this.API + '/api/agent/' + agentId + '/profile')
      .then(r => r.json())
      .then(data => {
        if (data.error) return;
        this.schema = (data.schema && data.schema.fields) || [];
        this.config = data.config || {};
        document.getElementById('soul-editor').value = data.soul_md || '';
        this.renderConfigForm();
      }).catch(() => {});
  },
  renderConfigForm() {
    const form = document.getElementById('config-form');
    if (!this.schema.length) { form.innerHTML = '<div style="color:#999;padding:8px 0">该 Agent 暂无可编辑的量化参数</div>'; return; }
    form.innerHTML = this.schema.map(f => {
      const val = this.config[f.key] != null ? this.config[f.key] : '';
      const attrs = [f.step ? ' step="' + f.step + '"' : '', f.min != null ? ' min="' + f.min + '"' : '', f.max != null ? ' max="' + f.max + '"' : ''].join('');
      return '<div class="cfg-field"><label>' + f.label + '</label><input type="number" name="' + f.key + '" value="' + val + '"' + attrs + '></div>';
    }).join('');
  },
  saveConfig() {
    if (!this.currentAgent) return;
    const body = { config: {} };
    this.schema.forEach(f => { const inp = document.querySelector('#config-form input[name="' + f.key + '"]'); if (inp && inp.value !== '') body.config[f.key] = inp.value; });
    document.getElementById('config-save').disabled = true;
    fetch(this.API + '/api/agent/' + this.currentAgent + '/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(r => r.json()).then(data => {
        document.getElementById('config-save').disabled = false;
        document.getElementById('config-msg').textContent = data.message || (data.ok ? '已保存' : data.error || '失败');
        document.getElementById('config-msg').style.color = data.ok ? '#16a34a' : '#dc2626';
        if (data.config) this.config = data.config;
      }).catch(() => { document.getElementById('config-save').disabled = false; });
  },
  saveSoul() {
    if (!this.currentAgent) return;
    document.getElementById('soul-save').disabled = true;
    fetch(this.API + '/api/agent/' + this.currentAgent + '/soul', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ content: document.getElementById('soul-editor').value }) })
      .then(r => r.json()).then(data => {
        document.getElementById('soul-save').disabled = false;
        document.getElementById('soul-msg').textContent = data.message || (data.ok ? '已保存' : data.error || '失败');
        document.getElementById('soul-msg').style.color = data.ok ? '#16a34a' : '#dc2626';
      }).catch(() => { document.getElementById('soul-save').disabled = false; });
  }
};

    const overlay = document.getElementById('ui-overlay');

  watchUiOverlay() {
    const overlay = document.getElementById('ui-overlay');
    if (!overlay || !window.ResizeObserver) return;
    new ResizeObserver(() => this.onResize()).observe(overlay);
  }

  onResize() {
    const top = this.getUiTopInset();
    const w = window.innerWidth, h = window.innerHeight;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
    this.renderer.setViewport(0, top, w, h - top);
    this.labelRenderer.setSize(w, h);
    this.labelRenderer.domElement.style.top = top + 'px';

  drawTicker(data) {
    const ctx = this.tickerCtx, w = this.tickerCanvas.width, h = this.tickerCanvas.height;
    ctx.fillStyle = '#0a1520';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#4a90c8';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('📊 实时行情', 16, 32);
    const syms = [
      { k:'BTC/USDT', f:'BTCUSDT' }, { k:'ETH/USDT', f:'ETHUSDT' }, { k:'XAU/USDT', f:'XAUUSDT' },
      { k:'SOL/USDT', f:'SOLUSDT' }, { k:'DOGE/USDT', f:'DOGEUSDT' },
    ];
    syms.forEach((s, i) => {
      const y = 62 + i * 36;
      ctx.fillStyle = '#8aa8c8';
      ctx.font = '18px sans-serif';
      ctx.fillText(s.k, 16, y);
      ctx.fillStyle = '#e8f0ff';
      ctx.font = 'bold 18px sans-serif';
      const p = data[s.f];
      let txt = '--';
      if (p != null) txt = s.f === 'XAUUSDT' ? '$' + Number(p).toFixed(2) : '$' + Number(p).toLocaleString(undefined, { maximumFractionDigits: 0 });
      ctx.fillText(txt, w - 16 - ctx.measureText(txt).width, y);
    });
    this.tickerTexture.needsUpdate = true;
  }

  spawnAgents() {
    const starts = [
      { id:'xau', x:4.2, z:5.6 }, { id:'major', x:7, z:5.6 }, { id:'altcoin', x:9.8, z:5.6 },
      { id:'newcoin', x:12.6, z:5.6 }, { id:'momentum', x:15.4, z:5.6 },
    ];
    starts.forEach(s => {
      const meta = AGENTS[s.id];
      const model = createGugugaga(meta.color);
      model.position.set(s.x, 0, s.z);
      model.userData.agentId = s.id;
      model.traverse(c => { if (c.isMesh) { c.userData.agentId = s.id; c.castShadow = true; } });
      this.scene.add(model);

      const label = makeLabel(meta.name, meta.color);
      label.position.set(0, 1.55, 0);
      model.add(label);

      this.characters[s.id] = {
        model, label, agentId: s.id, meta,
        x: s.x, z: s.z,
        pathQueue: [], pathIndex: 0, isWalking: false, destNode: null,
        isResting: false, isMassaging: false, isDining: false, isPlayingPoker: false,
        activityUntil: 0, state: 'idle', animT: 0,
        moveTimer: 0, nextMoveTime: 4000 + Math.random() * 6000,
        data: { id: s.id, ...meta }, lastTradeKey: null,
      };
    });
    this.clickables = Object.values(this.characters).map(c => c.model);
  }

  spawnNPCs() {
    [{ x:30, z:8.2, name:'服务员 Lily', color:'#e879a9' }, { x:36, z:20.4, name:'荷官 Jack', color:'#d4af37' }].forEach(n => {
      const m = createGugugaga(n.color);
      m.scale.setScalar(1.05);
      m.position.set(n.x, 0, n.z);
      this.scene.add(m);
      const lbl = makeLabel(n.name, n.color);
      lbl.position.set(0, 1.65, 0);
      m.add(lbl);
    });
  }

  setupInput() {
    this.raycaster = new THREE.Raycaster();
    this.mouse = new THREE.Vector2();
    this.renderer.domElement.addEventListener('pointerdown', (e) => {
      const rect = this.renderer.domElement.getBoundingClientRect();
      this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      this.raycaster.setFromCamera(this.mouse, this.camera);
      const hits = this.raycaster.intersectObjects(this.clickables, true);
      if (hits.length) {
        let id = hits[0].object.userData.agentId;
        if (!id) { hits[0].object.traverseAncestors(a => { if (a.userData.agentId) id = a.userData.agentId; }); }
        if (id) this.showAgentDetail(id);
      } else if (!e.target.closest('#agent-detail')) {
        document.getElementById('agent-detail').classList.remove('active');
        this.selectedAgentId = null;
      }
    });
  }

  renderAvatar(agentId) {
    const canvas = document.getElementById('detail-avatar');
    const meta = AGENTS[agentId];
    if (!canvas || !meta) return;
    const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    r.setSize(128, 128);
    r.setClearColor(0x000000, 0);
    const sc = new THREE.Scene();
    sc.add(new THREE.AmbientLight(0xfff5ee, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1);
    dl.position.set(2, 4, 3);
    sc.add(dl);
    const m = createGugugaga(meta.color);
    m.rotation.y = 0.4;
    sc.add(m);
    const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 20);
    cam.position.set(0, 1.0, 2.8);
    cam.lookAt(0, 0.7, 0);
    r.render(sc, cam);
    r.dispose();
  }

  showAgentDetail(agentId, refresh) {
    const char = this.characters[agentId];
    if (!char) return;
    this.selectedAgentId = agentId;
    const d = char.data || AGENTS[agentId];
    this.renderAvatar(agentId);
    document.getElementById('detail-icon').textContent = d.icon || '';
    document.getElementById('detail-name').textContent = d.name || agentId;
    document.getElementById('detail-desc').textContent = d.desc || '';
    document.getElementById('detail-strategy').textContent = d.strategy || '--';
    document.getElementById('detail-market').textContent = d.market || '--';
    document.getElementById('detail-interval').textContent = d.interval || '--';
    document.getElementById('detail-risk').textContent = d.risk || '--';
    document.getElementById('detail-capital').textContent = d.capital != null ? '$' + Number(d.capital).toLocaleString() : '--';
    const pnl = d.pnl || 0;
    const pnlEl = document.getElementById('detail-pnl');
    pnlEl.textContent = d.pnl != null ? (pnl > 0 ? '+' : '') + '$' + Number(pnl).toLocaleString() + ' (' + (d.pnl_pct != null ? d.pnl_pct.toFixed(1) : '0') + '%)' : '--';
    pnlEl.className = pnl > 0 ? 'up' : pnl < 0 ? 'down' : '';
    document.getElementById('detail-wr').textContent = d.win_rate != null ? d.win_rate.toFixed(1) + '% (' + (d.wins||0) + '/' + (d.trades||0) + ')' : '--';
    const status = d.is_circuit_break ? '熔断保护' : d.running ? '运行中' : '离线';
    const statusEl = document.getElementById('detail-status');
    statusEl.textContent = status;
    statusEl.className = d.is_circuit_break ? 'down' : d.running ? 'up' : '';
    document.getElementById('detail-pos').textContent = (d.positions ? d.positions.length : 0) + ' 个';
    const posDiv = document.getElementById('detail-positions');
    posDiv.innerHTML = (d.positions && d.positions.length) ? d.positions.map(p => {
      const c = p.direction && p.direction.includes('LONG') ? '#16a34a' : '#dc2626';
      return '<div class="row"><span>' + p.symbol + '</span><span style="color:' + c + '">' + p.direction + '</span></div>';
    }).join('') : '<div style="color:#999">无持仓</div>';
    document.getElementById('agent-detail').classList.add('active');
    if (!refresh) AgentProfile.load(agentId);
  }

  fetchData() {
    fetch(location.origin + '/trading/api/overview').then(r => r.json()).then(data => {
      this.updateUI(data);
      this.updateCharacters(data.agents);
    }).catch(() => {});
  }

  fetchTicker() {
    fetch(location.origin + '/trading/api/ticker').then(r => r.json()).then(data => {
      if (data.BTCUSDT) document.getElementById('btc-price').textContent = '$' + data.BTCUSDT.toLocaleString();
      if (data.ETHUSDT) document.getElementById('eth-price').textContent = '$' + data.ETHUSDT.toLocaleString();
      if (data.XAUUSDT) document.getElementById('xau-price').textContent = '$' + data.XAUUSDT.toFixed(2);
      this.drawTicker(data);
    }).catch(() => {});
  }

  updateUI(data) {
    const pnl = data.total_pnl || 0;
    const pnlEl = document.getElementById('total-pnl');
    pnlEl.textContent = pnl ? '$' + pnl.toLocaleString() : '--';
    pnlEl.className = pnl > 0 ? 'value up' : pnl < 0 ? 'value down' : 'value';
    document.getElementById('win-rate').textContent = data.total_wr ? data.total_wr.toFixed(1) + '%' : '--';
    document.getElementById('runner-status').textContent = data.runner && data.runner.running ? 'RUNNING' : 'STOPPED';
    document.getElementById('runner-status').className = data.runner && data.runner.running ? 'value up' : 'value down';
  }

  updateCharacters(agents) {
    if (!agents) return;
    agents.forEach(agent => {
      const char = this.characters[agent.id];
      if (!char) return;
      char.data = agent;
      const status = agent.is_circuit_break ? '熔断' : agent.positions && agent.positions.length ? '交易中' : agent.running ? '运行中' : '离线';
      const color = agent.is_circuit_break ? '#dc2626' : agent.positions && agent.positions.length ? '#d97706' : agent.running ? '#16a34a' : '#999';
      char.label.element.querySelector('.status').textContent = status + ' · 盈亏 ' + (agent.pnl > 0 ? '+' : '') + '$' + (agent.pnl || 0).toLocaleString();
      char.label.element.querySelector('.status').style.color = color;
      const desk = this.desks[agent.id];
      if (desk) desk.light.material.color.setHex(agent.is_circuit_break ? 0xdc2626 : agent.running ? 0x16a34a : 0x999999);
      if (agent.is_circuit_break) { char.state = 'panic'; if (!char.isWalking && !char.activityUntil) this.assignPathTo(char, 'scr_ctr'); }
      else if (agent.positions && agent.positions.length) char.state = 'trading';
      else if (agent.running) char.state = 'scanning';
      else char.state = 'idle';
    });
    if (this.selectedAgentId) this.showAgentDetail(this.selectedAgentId, true);
  }

  assignPathTo(char, nodeId) {
    char.isResting = char.isMassaging = char.isDining = char.isPlayingPoker = false;
    char.activityUntil = 0;
    const pts = OfficePath.pathToNode(char.x, char.z, nodeId);
    if (!pts || pts.length < 2) return;
    char.destNode = nodeId;
    char.pathQueue = pts.slice(1);
    char.pathIndex = 0;
    char.isWalking = true;
  }

  onPathComplete(char, now) {
    const node = char.destNode;
    char.destNode = null;
    if (node === OfficePath.boothByAgent[char.agentId]) this.startActivity(char, 'rest', now, 9000);
    else if (node === OfficePath.massageByAgent[char.agentId]) this.startActivity(char, 'massage', now, 10000);
    else if (node === OfficePath.dineByAgent[char.agentId]) this.startActivity(char, 'dine', now, 9000);
    else if (node === OfficePath.pokerByAgent[char.agentId]) this.startActivity(char, 'poker', now, 12000);
  }

  startActivity(char, type, now, dur) {
    char.isResting = type === 'rest';
    char.isMassaging = type === 'massage';
    char.isDining = type === 'dine';
    char.isPlayingPoker = type === 'poker';
    char.activityUntil = now + dur + Math.random() * 8000;
    char.isWalking = false;
    char.pathQueue = [];
    const seatMap = { rest: char.agentId, massage: 'bed_' + char.agentId, dine: 'dine_' + char.agentId, poker: 'poker_' + char.agentId };
    const seat = this.seats[seatMap[type]];
    if (seat) { char.x = seat.x; char.z = seat.z; }
    const labels = { rest:'休息中', massage:'按摩中', dine:'就餐中', poker:'打德州' };
    char.label.element.querySelector('.status').textContent = labels[type];
  }

  pickWanderTarget(char) {
    const desk = OfficePath.deskByAgent[char.agentId];
    if (char.state === 'trading') return desk;
    if (char.state === 'panic') return 'scr_ctr';
    if (char.state === 'idle') {
      const r = Math.random();
      if (r > 0.72) return OfficePath.boothByAgent[char.agentId];
      if (r > 0.52) return OfficePath.massageByAgent[char.agentId];
      if (r > 0.32) return OfficePath.dineByAgent[char.agentId];
      if (r > 0.14) return OfficePath.pokerByAgent[char.agentId];
      return desk;
    }
    const pool = OfficePath.wanderTargets;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  updateCharacter(char, dt, now) {
    char.animT += dt;
    const parts = char.model.userData.parts;

    if (char.activityUntil && now < char.activityUntil) {
      char.model.position.set(char.x, 0, char.z);
      if (char.isMassaging) {
        char.model.rotation.set(-Math.PI / 2, 0, 0);
        char.model.position.y = 0.35;
      } else if (char.isResting || char.isDining || char.isPlayingPoker) {
        char.model.rotation.set(0, char.model.rotation.y, 0);
        char.model.position.y = char.isDining || char.isPlayingPoker ? 0.15 : 0.05;
      }
      if (parts) { parts.wingL.rotation.z = 0.5 + Math.sin(char.animT * 2) * 0.1; parts.wingR.rotation.z = -0.5 - Math.sin(char.animT * 2) * 0.1; }
      return;
    } else if (char.activityUntil && now >= char.activityUntil) {
      char.activityUntil = 0;
      char.isResting = char.isMassaging = char.isDining = char.isPlayingPoker = false;
      char.model.rotation.set(0, char.model.rotation.y, 0);
      char.model.position.y = 0;
      char.moveTimer = 0;
      char.nextMoveTime = 2000 + Math.random() * 3000;
      this.assignPathTo(char, OfficePath.deskByAgent[char.agentId]);
    }

    char.moveTimer += dt * 1000;
    if (!char.isWalking && char.state !== 'panic' && char.state !== 'trading' && char.moveTimer > char.nextMoveTime) {
      char.moveTimer = 0;
      char.nextMoveTime = 4500 + Math.random() * 7000;
      this.assignPathTo(char, this.pickWanderTarget(char));
    }
    if (char.state === 'panic' && !char.isWalking) this.assignPathTo(char, 'scr_ctr');

    let moving = false;
    if (char.isWalking && char.pathQueue.length) {
      const wp = char.pathQueue[char.pathIndex];
      if (wp) {
        const dx = wp.x - char.x, dz = wp.z - char.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        const step = WALK_SPEED * dt;
        if (dist <= step) {
          char.x = wp.x; char.z = wp.z;
          char.pathIndex++;
          if (char.pathIndex >= char.pathQueue.length) {
            char.isWalking = false;
            char.pathQueue = [];
            this.onPathComplete(char, now);
          }
        } else {
          char.x += (dx / dist) * step;
          char.z += (dz / dist) * step;
          char.model.rotation.y = Math.atan2(dx, dz);
          moving = true;
        }
      }
    }

    const bob = moving ? Math.abs(Math.sin(char.animT * 12)) * 0.06 : Math.sin(char.animT * 2) * 0.015;
    char.model.position.set(char.x, bob, char.z);
    if (parts && moving) {
      parts.wingL.rotation.z = 0.5 + Math.sin(char.animT * 14) * 0.35;
      parts.wingR.rotation.z = -0.5 - Math.sin(char.animT * 14) * 0.35;
      parts.footL.position.y = 0.06 + Math.abs(Math.sin(char.animT * 14)) * 0.04;
      parts.footR.position.y = 0.06 + Math.abs(Math.sin(char.animT * 14 + Math.PI)) * 0.04;
    }
    if (char.state === 'trading' && !moving && parts) {
      parts.wingL.rotation.z = 0.3 + Math.sin(char.animT * 8) * 0.4;
      parts.wingR.rotation.z = -0.3 - Math.sin(char.animT * 8) * 0.4;
    }
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    const dt = Math.min(this.clock.getDelta(), 0.05);
    const now = performance.now();
    Object.values(this.characters).forEach(c => this.updateCharacter(c, dt, now));
    this.controls.update();
    const top = this.getUiTopInset();
    this.renderer.setViewport(0, top, window.innerWidth, window.innerHeight - top);
    this.renderer.render(this.scene, this.camera);
    this.labelRenderer.render(this.scene, this.camera);
  }
}

const world = new TradingWorld3D(document.getElementById('game-container'));
</script>
