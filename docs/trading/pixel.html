// ============================================================

const PixelArt = {
  // Create a pixel texture from a color grid
  createTexture(scene, key, width, height, pixels, scale) {
    scale = scale || WORLD.PIXEL_SCALE || 4;
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    
    if (!pixels || pixels.length !== width * height) {
      console.error('Invalid pixels array for', key, 'expected', width * height, 'got', pixels ? pixels.length : 'null');
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      scene.textures.addCanvas(key, canvas);
      return key;
    }
    
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const color = pixels[y * width + x];
        if (color && color !== 'transparent') {
          ctx.fillStyle = color;
          ctx.fillRect(x * scale, y * scale, scale, scale);
          if (scale >= 3) {
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(x * scale, y * scale, scale, 1);
            ctx.fillRect(x * scale, y * scale, 1, scale);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(x * scale, y * scale + scale - 1, scale, 1);
            ctx.fillRect(x * scale + scale - 1, y * scale, 1, scale);
          }
        }
      }
    }
    
    scene.textures.addCanvas(key, canvas);
    return key;
  },

  fillPixel(ctx, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * size, y * size, size, size);
  },

  // Generate a 16x16 pixel character with head, body, limbs, eyes

    const shoe = '#4a3f35';
    const pants = '#3a3530';
    const t = 'transparent';
    
    // 16x16 grid - each row
    return [
      // Row 0-1: empty
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,

  deskByAgent: { xau: 'desk_xau', major: 'desk_maj', altcoin: 'desk_alt', newcoin: 'desk_new', momentum: 'desk_mom' },
  boothByAgent: { xau: 'booth_xau', major: 'booth_maj', altcoin: 'booth_alt', newcoin: 'booth_new', momentum: 'booth_mom' },
  boothDoorByAgent: { xau: 'booth_door_xau', major: 'booth_door_maj', altcoin: 'booth_door_alt', newcoin: 'booth_door_new', momentum: 'booth_door_mom' },
  wanderTargets: [
    'desk_xau', 'desk_maj', 'desk_alt', 'desk_new', 'desk_mom',
    'scr_xau', 'scr_maj', 'scr_alt', 'scr_ctr', 'scr_mom',
    'booth_door_xau', 'booth_door_maj', 'booth_door_alt', 'booth_door_new', 'booth_door_mom',
    'booth_xau', 'booth_maj', 'booth_alt', 'booth_new', 'booth_mom',
  ],
  _edges: null,
  _buildEdges() {
    if (this._edges) return this._edges;
    const pairs = [
      ['a_w','a_xau'],['a_xau','a_maj'],['a_maj','a_alt'],['a_alt','a_new'],['a_new','a_mom'],['a_mom','a_e'],
      ['u_w','u_xau'],['u_xau','u_maj'],['u_maj','u_alt'],['u_alt','u_new'],['u_new','u_mom'],['u_mom','u_e'],
      ['d_w','d_xau'],['d_xau','d_maj'],['d_maj','d_alt'],['d_alt','d_new'],['d_new','d_mom'],['d_mom','d_e'],
      ['booth_door_xau','d_xau'],['booth_door_xau','booth_xau'],
      ['booth_door_maj','d_maj'],['booth_door_maj','booth_maj'],
      ['booth_door_alt','d_alt'],['booth_door_alt','booth_alt'],
      ['booth_door_new','d_new'],['booth_door_new','booth_new'],
      ['booth_door_mom','d_mom'],['booth_door_mom','booth_mom'],
      ['desk_xau','a_xau'],['desk_maj','a_maj'],['desk_alt','a_alt'],['desk_new','a_new'],['desk_mom','a_mom'],
      ['a_xau','u_xau'],['a_maj','u_maj'],['a_alt','u_alt'],['a_new','u_new'],['a_mom','u_mom'],
      ['a_xau','d_xau'],['a_maj','d_maj'],['a_alt','d_alt'],['a_new','d_new'],['a_mom','d_mom'],
      ['u_xau','scr_xau'],['u_maj','scr_maj'],['u_alt','scr_alt'],['u_new','scr_new'],['u_mom','scr_mom'],
      ['u_maj','scr_ctr'],['u_alt','scr_ctr'],['u_new','scr_ctr'],
    ];
    const adj = {};
    Object.keys(this.nodes).forEach(k => { adj[k] = []; });
    pairs.forEach(([a,b]) => {
      if (adj[a] && adj[b]) { adj[a].push(b); adj[b].push(a); }
    });
    this._edges = adj;
    return adj;
  },
  nearestNode(x, y) {
    let best = null, bestD = Infinity;
    Object.entries(this.nodes).forEach(([id, n]) => {
      const d = (n.x - x) ** 2 + (n.y - y) ** 2;
      if (d < bestD) { bestD = d; best = id; }
    });
    return best;
  },
  findPath(fromId, toId) {
    if (fromId === toId) return [this.nodes[toId]];
    const adj = this._buildEdges();
    const q = [[fromId]];
    const seen = new Set([fromId]);
    while (q.length) {
      const path = q.shift();
      const cur = path[path.length - 1];
      for (const nb of adj[cur] || []) {
        if (seen.has(nb)) continue;
        seen.add(nb);
        const np = path.concat([nb]);
        if (nb === toId) {
          return np.map(id => ({ x: this.nodes[id].x, y: this.nodes[id].y }));
        }
        q.push(np);
      }
    }
    return [this.nodes[toId]];
  },
  pathBetween(x1, y1, x2, y2) {
    const from = this.nearestNode(x1, y1);
    const to = this.nearestNode(x2, y2);
    return this.findPath(from, to);
  },
  pathToNode(x, y, nodeId) {
    const from = this.nearestNode(x, y);
    return this.findPath(from, nodeId);
  },

  },
};

  fitCamera() {
    var vw = this.scale.width;
    var vh = this.scale.height;
    var zoom = Math.min(vw / this.WORLD_W, vh / this.WORLD_H) * 0.97;
    this.baseZoom = zoom;
    this.minZoom = zoom * 0.55;
    this.maxZoom = zoom * 1.45;
    this.cameras.main.setZoom(zoom);
    this.cameras.main.centerOn(this.WORLD_W / 2, this.WORLD_H / 2);
  }

  setupCameraControls() {
    var self = this;
    var cam = this.cameras.main;
    this.camDragging = false;
    this.camDidDrag = false;
    this.camDragStart = { x: 0, y: 0 };
    this.camScrollStart = { x: 0, y: 0 };
    this.lastPinchDist = 0;

    this.input.on('wheel', function(pointer, over, deltaX, deltaY) {
      var z = cam.zoom - deltaY * 0.0012;
      cam.zoom = Phaser.Math.Clamp(z, self.minZoom || 0.3, self.maxZoom || 1.5);
    });

    this.input.on('pointerdown', function(pointer) {
      if (pointer.pointerType === 'touch' && self.input.pointer1.isDown && self.input.pointer2.isDown) {
        self.lastPinchDist = Phaser.Math.Distance.Between(
          self.input.pointer1.x, self.input.pointer1.y,
          self.input.pointer2.x, self.input.pointer2.y
        );
      }
    });

    this.input.on('pointermove', function(pointer) {
      if (self.input.pointer1.isDown && self.input.pointer2.isDown) {
        var dist = Phaser.Math.Distance.Between(
          self.input.pointer1.x, self.input.pointer1.y,
          self.input.pointer2.x, self.input.pointer2.y
        );
        if (self.lastPinchDist > 0) {
          cam.zoom = Phaser.Math.Clamp(cam.zoom * (dist / self.lastPinchDist), self.minZoom || 0.3, self.maxZoom || 1.5);
        }
        self.lastPinchDist = dist;
        return;
      }
      if (!self.camDragging || !pointer.isDown) return;
      var dx = pointer.x - self.camDragStart.x;
      var dy = pointer.y - self.camDragStart.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) self.camDidDrag = true;
      cam.scrollX = self.camScrollStart.x - dx / cam.zoom;
      cam.scrollY = self.camScrollStart.y - dy / cam.zoom;
    });

    this.input.on('pointerup', function() {
      self.camDragging = false;
      self.lastPinchDist = 0;
      self.time.delayedCall(50, function() { self.camDidDrag = false; });
    });
  }

  beginCameraDrag(pointer) {
    this.camDragging = true;
    this.camDidDrag = false;
    this.camDragStart = { x: pointer.x, y: pointer.y };
    this.camScrollStart = { x: this.cameras.main.scrollX, y: this.cameras.main.scrollY };
  }

  updateDayNight() {
    var hour = new Date().getHours();
    var alpha = 0;
    if (hour >= 21 || hour < 6) alpha = 0.38;
    else if (hour >= 19) alpha = 0.22;
    else if (hour >= 17) alpha = 0.1;
    if (this.lightingOverlay) this.lightingOverlay.setAlpha(alpha);
    this.isNight = alpha > 0.2;
    Object.values(this.booths || {}).forEach(function(b) {
      if (b.boothLight) b.boothLight.setAlpha(b.boothLightBaseAlpha * (alpha > 0.2 ? 1.6 : 1));
    });
  }

  createParticles() {

      speed: { min: 20, max: 60 },
      angle: { min: 250, max: 290 },
      scale: { start: 1, end: 0 },
      lifespan: 1000,
      frequency: -1,
      quantity: 1,
      emitting: false
    });
    this.particles.setDepth(5);
  }

  setupInput() {
    var self = this;
    this.selectedAgentId = null;
    
    document.getElementById('detail-close').addEventListener('click', function() {
      document.getElementById('agent-detail').classList.remove('active');
      self.selectedAgentId = null;
    });
    
    this.input.on('pointerdown', function(pointer, currentlyOver) {
      if (currentlyOver && currentlyOver.length > 0) {
        var hitChar = currentlyOver.some(function(obj) {
          return Object.values(self.characters).some(function(c) {
            return c.sprite === obj || c.hitZone === obj || c.nameTag === obj;
          });
        });
        if (hitChar) return;
      }
      var wx = pointer.worldX, wy = pointer.worldY;
      var clickedChar = Object.values(self.characters).some(function(c) {
        return Phaser.Math.Distance.Between(wx, wy, c.sprite.x, c.sprite.y) < 48;
      });
      if (clickedChar) return;
      if (!self.camDidDrag) {
        document.getElementById('agent-detail').classList.remove('active');
        self.selectedAgentId = null;
      }
      self.beginCameraDrag(pointer);
    });
  }

  drawDetailAvatar(agentId) {
    var canvas = document.getElementById('detail-avatar');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var tex = this.textures.get('char_' + agentId + '_idle');
    if (tex && tex.getSourceImage) {
      var img = tex.getSourceImage();
      var scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.92;
      var dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
    }
  }

  showAgentDetail(agentId, options) {
    options = options || {};
    var char = this.characters[agentId];
    if (!char) return;
    
    this.selectedAgentId = agentId;
    var meta = PixelArt.characters[agentId] || {};
    var d = char.data || meta;
    
    this.drawDetailAvatar(agentId);
    document.getElementById('detail-icon').textContent = d.icon || meta.icon || '';
    document.getElementById('detail-name').textContent = d.name || meta.name || agentId;
    document.getElementById('detail-desc').textContent = d.desc || meta.desc || '';
    document.getElementById('detail-strategy').textContent = d.strategy || meta.strategy || '--';
    document.getElementById('detail-market').textContent = d.market || meta.market || '--';
    document.getElementById('detail-interval').textContent = d.interval || meta.interval || '--';
    document.getElementById('detail-risk').textContent = d.risk || meta.risk || '--';
    document.getElementById('detail-capital').textContent = d.capital != null ? '$' + Number(d.capital).toLocaleString() : '--';
    
    var pnlEl = document.getElementById('detail-pnl');
    var pnl = d.pnl || 0;
    pnlEl.textContent = d.pnl != null ? (pnl > 0 ? '+' : '') + '$' + Number(pnl).toLocaleString() + ' (' + (d.pnl_pct != null ? d.pnl_pct.toFixed(1) : '0') + '%)' : '--';
    pnlEl.className = pnl > 0 ? 'up' : pnl < 0 ? 'down' : '';
    
    document.getElementById('detail-wr').textContent = d.win_rate != null ? d.win_rate.toFixed(1) + '% (' + (d.wins || 0) + '/' + (d.trades || 0) + ')' : '--';
    
    var status = d.is_circuit_break ? '熔断保护' : d.running ? '运行中' : '离线';
    var statusEl = document.getElementById('detail-status');
    statusEl.textContent = status;
    statusEl.className = d.is_circuit_break ? 'down' : d.running ? 'up' : '';
    
    document.getElementById('detail-pos').textContent = (d.positions ? d.positions.length : 0) + ' 个';
    
    var posDiv = document.getElementById('detail-positions');
    if (d.positions && d.positions.length > 0) {
      posDiv.innerHTML = d.positions.map(function(p) {
        var dirColor = p.direction && p.direction.includes('LONG') ? '#16a34a' : '#dc2626';
        return '<div class="row"><span>' + p.symbol + '</span><span style="color:' + dirColor + '">' + p.direction + '</span></div>';
      }).join('');
    } else {
      posDiv.innerHTML = '<div style="color:#999">无持仓</div>';
    }
    
    document.getElementById('agent-detail').classList.add('active');
    if (!options.refresh) {
      char.sprite.setTint(0xffffcc);
      var self = this;
      this.time.delayedCall(180, function() {
        if (self.characters[agentId]) self.characters[agentId].sprite.clearTint();
      });
    }
  }

  startDataPolling() {
    this.fetchData();
    this.fetchTicker();
    var self = this;
    this.time.addEvent({ delay: 5000, callback: function() { self.fetchData(); }, loop: true });
    this.time.addEvent({ delay: 10000, callback: function() { self.fetchTicker(); }, loop: true });
    this.time.addEvent({ delay: 60000, callback: function() { self.updateDayNight(); }, loop: true });
  }

  fetchData() {
    var self = this;
    var API = location.origin + '/trading';
    fetch(API + '/api/overview')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        self.updateUI(data);
        self.updateCharacters(data.agents);
        if (data.risk) {
          self.updateRiskIndicator(data.risk);
        }
      })
      .catch(function(e) {
        console.error('Data fetch error:', e);
      });
  }

  fetchTicker() {
    var self = this;
    var API = location.origin + '/trading';
    fetch(API + '/api/ticker')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        self.tickerData = data;
        if (data.BTCUSDT) document.getElementById('btc-price').textContent = '$' + data.BTCUSDT.toLocaleString();
        if (data.ETHUSDT) document.getElementById('eth-price').textContent = '$' + data.ETHUSDT.toLocaleString();
        if (data.XAUUSDT) document.getElementById('xau-price').textContent = '$' + data.XAUUSDT.toFixed(2);
        self.updateBigScreenTicker(data);
      })
      .catch(function(e) {});
  }

  updateBigScreenTicker(data) {
    if (!this.tickerTexts || !data) return;
    var map = {
      BTC: data.BTCUSDT, ETH: data.ETHUSDT, XAU: data.XAUUSDT,
      SOL: data.SOLUSDT, DOGE: data.DOGEUSDT
    };
    this.tickerTexts.forEach(function(t) {
      var price = map[t.symbol];
      var label = t.symbol + ': ';
      if (price == null) label += '--';
      else if (t.symbol === 'XAU') label += '$' + price.toFixed(2);
      else if (price >= 1000) label += '$' + price.toLocaleString(undefined, { maximumFractionDigits: 0 });
      else label += '$' + price.toFixed(2);
      t.text.setText(label);
    });
  }

  showTradeBubble(char, trade) {
    if (!trade || !char.bubbleText) return;
    var pct = trade.pnl_pct != null ? trade.pnl_pct : 0;
    var sign = pct >= 0 ? '+' : '';
    var msg = (trade.symbol || '') + ' ' + sign + pct.toFixed(1) + '%';
    char.bubbleText.setText(msg);
    char.bubbleText.setColor(pct >= 0 ? '#16a34a' : '#dc2626');
    char.bubbleText.setAlpha(1);
    char.bubbleText.y = char.sprite.y - 58;
    var self = this;
    this.tweens.killTweensOf(char.bubbleText);
    this.tweens.add({
      targets: char.bubbleText,
      y: char.sprite.y - 88,
      alpha: 0,
      duration: 4200,
      ease: 'Sine.easeOut',
      onComplete: function() { char.bubbleText.setAlpha(0); }
    });
  }

  updateUI(data) {
    var pnl = data.total_pnl || 0;
    var pnlEl = document.getElementById('total-pnl');
    pnlEl.textContent = pnl ? '$' + pnl.toLocaleString() : '--';
    pnlEl.className = pnl > 0 ? 'value up' : pnl < 0 ? 'value down' : 'value';
    
    document.getElementById('win-rate').textContent = data.total_wr ? data.total_wr.toFixed(1) + '%' : '--';
    document.getElementById('runner-status').textContent = data.runner && data.runner.running ? 'RUNNING' : 'STOPPED';
    document.getElementById('runner-status').className = data.runner && data.runner.running ? 'value up' : 'value down';
  }

  updateCharacters(agents) {
    if (!agents) return;
    
    var self = this;
    agents.forEach(function(agent) {
      var char = self.characters[agent.id];
      if (!char) return;
      
      char.data = agent;
      
      var status = agent.is_circuit_break ? '熔断' : 
                   agent.positions && agent.positions.length ? '交易中' :
                   agent.running ? '运行中' : '离线';
      char.statusText.setText(status);
      char.statusText.setColor(agent.is_circuit_break ? '#dc2626' : 
                               agent.positions && agent.positions.length ? '#d97706' :
                               agent.running ? '#16a34a' : '#999');
      
      var pnl = agent.pnl || 0;
      char.pnlText.setText('盈亏: ' + (pnl > 0 ? '+' : '') + '$' + pnl.toLocaleString());
      char.pnlText.setColor(pnl > 0 ? '#16a34a' : pnl < 0 ? '#dc2626' : '#888');
      
      var desk = self.desks[agent.id];
      if (desk) {
        var lightColor = agent.is_circuit_break ? 0xdc2626 :
                          agent.running ? 0x16a34a : 0x999999;
        desk.light.setFillStyle(lightColor);
        desk.agentRunning = !!agent.running;
        desk.agentTrading = !!(agent.positions && agent.positions.length > 0);
        if (agent.running) {
          desk.light.setAlpha(0.5 + Math.sin(self.time.now / 200) * 0.5);
        } else {
          desk.light.setAlpha(1);
        }
      }
      
      if (agent.trades_history && agent.trades_history.length > 0) {
        var latest = agent.trades_history[agent.trades_history.length - 1];
        var tradeKey = latest.symbol + '_' + (latest.opened_at || '') + '_' + (latest.pnl_pct || '');
        if (tradeKey !== char.lastTradeKey && latest.pnl_pct != null) {
          char.lastTradeKey = tradeKey;
          self.showTradeBubble(char, latest);
        }
      }
      
      if (agent.is_circuit_break) {
        char.state = 'panic';
        if (!char.isWalking && !char.isResting) {
          self.assignPathTo(char, 'scr_ctr');
        }
      } else if (agent.positions && agent.positions.length > 0) {
        char.state = 'trading';
        if (!char.isResting && !char.isWalking && Math.random() > 0.92) {
          self.assignPathTo(char, OfficePath.deskByAgent[agent.id]);
        }
      } else if (agent.running) {
        char.state = 'scanning';
      } else {
        char.state = 'idle';
      }
      
      if (Math.abs(pnl) > 100 && Math.random() > 0.7) {
        self.emitPnlParticles(char.sprite.x, char.sprite.y, pnl > 0);
      }
    });
    
    if (self.selectedAgentId) {
      self.showAgentDetail(self.selectedAgentId, { refresh: true });
    }
  }

  updateRiskIndicator(risk) {
    if (risk.circuit_break) {
      this.cameras.main.flash(500, 220, 60, 60, false);
    }
  }

  emitPnlParticles(x, y, isUp) {
    var key = isUp ? 'particle_up' : 'particle_down';
    var emitter = this.add.particles(x, y, key, {
      speed: { min: 30, max: 80 },
      angle: { min: 200, max: 340 },
      scale: { start: 1.5, end: 0 },
      lifespan: 1500,
      quantity: 5,
      emitting: false
    });
    emitter.explode(5);
    emitter.setDepth(5);
  }

  update(time, delta) {
    var self = this;
    
    // Animate characters
    Object.entries(this.characters).forEach(function(entry) {
      self.animateCharacter(entry[1], time, delta);
    });
    
    // Animate ticker scroll
    this.tickerScroll += 0.3;
    this.tickerTexts.forEach(function(t) {
      t.text.x = t.baseX - (self.tickerScroll % 200);
      if (t.text.x < -100) t.text.x += 200;
    });
    
    this.updateDeskScreens(time);
    if (Math.floor(time / 30000) !== this._lastDayNightTick) {
      this._lastDayNightTick = Math.floor(time / 30000);
      this.updateDayNight();
    }
  }

  updateDeskScreens(time) {
    Object.values(this.desks).forEach(function(desk) {
      if (!desk.screenBars) return;
      desk.screenBars.forEach(function(bar, i) {
        var h = 6 + Math.abs(Math.sin(time * bar.speed + bar.phase)) * 14;
        if (desk.agentTrading) h += 4 + Math.sin(time * 0.008 + i) * 3;
        bar.rect.setSize(4, h);
        bar.rect.y = 2;
        var color;
        if (desk.agentTrading) {
          color = i % 2 === 0 ? 0x16a34a : 0xdc2626;
        } else if (desk.agentRunning) {
          color = 0x4a90c8;
        } else {
          color = 0x3a5060;
        }
        bar.rect.setFillStyle(color);
      });
      if (desk.scanLine) {
        desk.scanLine.y = -10 + ((time * 0.04) % 24);
        desk.scanLine.setAlpha(desk.agentRunning ? 0.45 : 0.15);
      }
      if (desk.screenCursor) {
        desk.screenCursor.setAlpha(desk.agentRunning && Math.floor(time / 400) % 2 === 0 ? 1 : 0.2);
        desk.screenCursor.x = -26 + ((time * 0.02) % 52);
      }
    });
  }

  assignPathTo(char, nodeId) {
    if (char.isResting) {
      char.isResting = false;
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
    }
    var pts = OfficePath.pathToNode(char.sprite.x, char.sprite.y, nodeId);
    if (!pts || pts.length < 2) return;
    char.destNode = nodeId;
    char.pathQueue = pts.slice(1);
    char.pathIndex = 0;
    char.isWalking = true;
  }

  onPathComplete(char, time) {
    var node = char.destNode;
    char.destNode = null;
    if (node === OfficePath.boothByAgent[char.agentId]) {
      this.startResting(char, time);
    }
  }

  startResting(char, time) {
    var booth = this.booths && this.booths[char.agentId];
    char.isResting = true;
    char.restUntil = time + 9000 + Math.random() * 8000;
    char.restToggle = time;
    char.restPose = 'sit';
    char.isWalking = false;
    char.pathQueue = [];
    if (booth) {
      char.sprite.x = booth.seatX;
      char.sprite.y = booth.seatY;
    }
    char.sprite.setDepth(1.05);
    char.statusText.setText('休息中');
    char.statusText.setColor('#6b8e6b');
  }

  pickWanderTarget(char) {
    var deskNode = OfficePath.deskByAgent[char.agentId];
    if (char.state === 'trading') return deskNode;
    if (char.state === 'panic') return 'scr_ctr';
    if (char.state === 'idle' && (!char.data || !char.data.running)) {
      return Math.random() > 0.35 ? OfficePath.boothByAgent[char.agentId] : deskNode;
    }
    if (char.state === 'scanning' && Math.random() > 0.65) {
      return ['scr_xau','scr_maj','scr_alt','scr_ctr','scr_mom'][Math.floor(Math.random() * 5)];
    }
    var pool = OfficePath.wanderTargets.filter(function(n) { return n !== deskNode || Math.random() > 0.45; });
    if (Math.random() > 0.45) pool.push(OfficePath.boothByAgent[char.agentId]);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  animateCharacter(char, time, delta) {
    char.animTimer += delta;

    if (char.isResting) {
      this.animateResting(char, time, delta);
      return;
    }

    char.moveTimer += delta;

    if (char.state === 'trading' && !char.isWalking && Math.random() > 0.97) {
      this.assignPathTo(char, OfficePath.deskByAgent[char.agentId]);
    }

    if (char.moveTimer > char.nextMoveTime && char.state !== 'panic' && char.state !== 'trading' && !char.isWalking) {
      char.moveTimer = 0;
      char.nextMoveTime = 4500 + Math.random() * 7000;
      this.assignPathTo(char, this.pickWanderTarget(char));
    }

    if (char.state === 'panic' && !char.isWalking) {
      this.assignPathTo(char, 'scr_ctr');
    }

    var agentId = char.agentId;
    var moving = false;
    var dx = 0;

    if (char.isWalking && char.pathQueue.length > 0) {
      var wp = char.pathQueue[char.pathIndex];
      if (wp) {
        dx = wp.x - char.sprite.x;
        var dy = wp.y - char.sprite.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var step = (WORLD.WALK_SPEED * delta) / 1000;
        if (dist <= step || dist < 2) {
          char.sprite.x = wp.x;
          char.sprite.y = wp.y;
          char.pathIndex++;
          if (char.pathIndex >= char.pathQueue.length) {
            char.isWalking = false;
            char.pathQueue = [];
            char.pathIndex = 0;
            this.onPathComplete(char, time);
          }
        } else {
          char.sprite.x += (dx / dist) * step;
          char.sprite.y += (dy / dist) * step;
          moving = true;
        }
      } else {
        char.isWalking = false;
      }
    }

    if (moving) {
      char.walkFrame += delta;
      var frameKey = Math.floor(char.walkFrame / 180) % 2 === 0 ? '_walk1' : '_walk2';
      char.sprite.setTexture('char_' + agentId + frameKey);
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
      if (dx < -0.5) char.sprite.setFlipX(true);
      else if (dx > 0.5) char.sprite.setFlipX(false);
    } else if (char.state === 'trading' || char.state === 'panic') {
      char.sprite.setTexture('char_' + agentId + '_excited');
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
    } else {
      char.sprite.setTexture('char_' + agentId + '_idle');
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
      if (char.state === 'idle' || char.state === 'scanning') {
        char.sprite.y += Math.sin(char.animTimer / 500) * 0.8;
      }
    }

    this.syncCharLabels(char);
    this.applyCharTint(char);
    if (char.state === 'trading' && !moving) {
      char.sprite.y += Math.sin(char.animTimer / 150) * 0.8;
    }
  }

  animateResting(char, time, delta) {
    var agentId = char.agentId;
    if (time > char.restUntil) {
      char.isResting = false;
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
      char.sprite.setDepth(3);
      char.moveTimer = 0;
      char.nextMoveTime = 2000 + Math.random() * 3000;
      this.assignPathTo(char, OfficePath.deskByAgent[char.agentId]);
      return;
    }
    if (time - char.restToggle > 4500) {
      char.restToggle = time;
      char.restPose = char.restPose === 'sit' ? 'lie' : 'sit';
    }
    var booth = this.booths && this.booths[char.agentId];
    if (booth) {
      char.sprite.x = booth.seatX;
      char.sprite.y = booth.seatY;
    }
    if (char.restPose === 'sit') {
      char.sprite.setTexture('char_' + agentId + '_sit');
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE * 0.95);
      char.sprite.setFlipX(false);
      char.sprite.y += Math.sin(char.animTimer / 800) * 0.5;
    } else {
      char.sprite.setTexture('char_' + agentId + '_sit');
      char.sprite.setAngle(-90);
      char.sprite.setScale(WORLD.CHAR_SCALE * 0.9);
      char.sprite.x += 18;
      char.sprite.y += 8;
    }
    this.syncCharLabels(char);
    char.sprite.clearTint();
    char.sprite.setAlpha(1);
  }

  syncCharLabels(char) {
    char.nameTag.x = char.sprite.x;
    char.nameTag.y = char.sprite.y - 44;
    char.hitZone.x = char.sprite.x;
    char.hitZone.y = char.sprite.y;
    char.statusText.x = char.sprite.x;
    char.statusText.y = char.sprite.y + 30;
    char.pnlText.x = char.sprite.x;
    char.pnlText.y = char.sprite.y + 44;
    if (char.bubbleText && char.bubbleText.alpha > 0) {
      char.bubbleText.x = char.sprite.x;
    }
  }

  applyCharTint(char) {
    if (char.isResting) return;
    if (char.state === 'panic') {
      char.sprite.setTint(0xff6666);
      char.sprite.setAlpha(Math.floor(char.animTimer / 200) % 2 === 0 ? 0.65 : 1);
    } else {
      char.sprite.clearTint();
      char.sprite.setAlpha(1);
    }
  }
}

var config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#faf6ef',
  pixelArt: true,
  roundPixels: true,
  scene: TradingWorld,
  scale: {
    mode: Phaser.Scale.RESIZE,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: window.innerWidth,
    height: window.innerHeight
  },
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 } }
  },
  callbacks: {
    preBoot: function(game) {
      console.log('Phaser preBoot');
    },
    postBoot: function(game) {
      console.log('Phaser postBoot');
    }
  }
};

var game = new Phaser.Game(config);

window.addEventListener('resize', function() {
  game.scale.resize(window.innerWidth, window.innerHeight);
  var scene = game.scene.getScene('TradingWorld');
  if (scene && scene.fitCamera) scene.fitCamera();
});
</script>
