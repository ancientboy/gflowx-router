<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #faf6ef; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
#game-container { width: 100vw; height: 100vh; touch-action: none; }
#ui-overlay {
  position: fixed; top: 0; left: 0; right: 0; padding: 8px 16px;
  display: flex; gap: 12px; align-items: center; z-index: 100;
  background: rgba(250,246,239,0.94); border-bottom: 2px solid #e8dfd0;
  font-size: 13px; color: #4a3f35;
}
#ui-overlay .stat { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
#ui-overlay .stat .label { color: #7a6e62; font-size: 11px; font-weight: 500; }
#ui-overlay .stat .value { color: #2d2520; font-weight: 600; font-size: 14px; }
#ui-overlay .stat .value.up { color: #16a34a; }
#ui-overlay .stat .value.down { color: #dc2626; }
#ui-overlay .divider { width: 1px; height: 16px; background: #d4c8b8; flex-shrink: 0; }
#ui-overlay .hint { color: #9a8b7a; font-size: 11px; }
#back-btn {
  position: fixed; bottom: 16px; right: 16px; z-index: 100;

}

#cam-hint {

  font-size: 11px; pointer-events: none; opacity: 0.85; transition: opacity 1s ease;
}
#cam-hint.hidden { opacity: 0; }
#agent-detail {
  position: fixed; bottom: 16px; left: 16px; z-index: 100;
  background: rgba(255,252,247,0.98); border: 2px solid #d4c8b8;
  border-radius: 12px; padding: 16px 18px; min-width: 320px; max-width: 420px;
  display: none; font-size: 13px; color: #4a3f35;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  font-family: inherit; max-height: 72vh; overflow-y: auto;
}
#agent-detail.active { display: block; }
#agent-detail .detail-header { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #e8dfd0; }
#agent-detail #detail-avatar { width: 72px; height: 72px; image-rendering: pixelated; border: 2px solid #d4c8b8; border-radius: 8px; background: #f5f0e8; flex-shrink: 0; }
#agent-detail .detail-meta { flex: 1; min-width: 0; }
#agent-detail .title { color: #2d2520; font-weight: 700; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
#agent-detail .desc { color: #6b5e4e; font-size: 12px; line-height: 1.5; }
#agent-detail .row { display: flex; justify-content: space-between; margin: 5px 0; gap: 8px; font-size: 13px; }
#agent-detail .row span:first-child { color: #7a6e62; font-weight: 500; }
#agent-detail .row span:last-child { text-align: right; max-width: 58%; word-break: break-word; font-weight: 600; color: #2d2520; }
#agent-detail .positions { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e8dfd0; font-size: 12px; }
#agent-detail .up { color: #16a34a !important; }
#agent-detail .down { color: #dc2626 !important; }
#agent-detail .detail-close { position: absolute; top: 10px; right: 12px; background: #ede8dc; border: none; color: #6b5e4e; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 6px; }
#agent-detail .detail-close:hover { background: #d4c8b8; }
#agent-detail .detail-tabs { display: flex; gap: 4px; margin: 10px 0 8px; border-bottom: 1px solid #e8dfd0; padding-bottom: 8px; }
#agent-detail .detail-tabs button {
  flex: 1; padding: 6px 8px; border: 1px solid #d4c8b8; border-radius: 6px;
  background: #f5f0e8; color: #6b5e4e; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
#agent-detail .detail-tabs button.active { background: #4a3f35; color: #faf6ef; border-color: #4a3f35; }
#agent-detail .tab-panel { display: none; }
#agent-detail .tab-panel.active { display: block; }
#agent-detail .cfg-field { margin: 8px 0; }
#agent-detail .cfg-field label { display: block; font-size: 11px; color: #7a6e62; margin-bottom: 3px; font-weight: 600; }
#agent-detail .cfg-field input, #agent-detail .cfg-field select {

}
#agent-detail #soul-editor {

  font-size: 12px; font-family: 'SF Mono', Consolas, monospace; line-height: 1.45; resize: vertical;
}
#agent-detail .save-btn {
  margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 6px;
  background: #4a3f35; color: #faf6ef; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
#agent-detail .save-btn:hover { background: #3a322c; }
#agent-detail .save-msg { margin-top: 6px; font-size: 11px; color: #16a34a; min-height: 16px; }
#agent-detail .save-hint { font-size: 11px; color: #9a8b7a; margin-top: 4px; line-height: 1.4; }
@media (max-width: 768px) {
  #ui-overlay { flex-wrap: wrap; gap: 6px 10px; padding: 6px 10px; font-size: 12px; }

  #agent-detail {
    left: 8px; right: 8px; bottom: 8px; max-width: none; min-width: 0;
    max-height: 55vh; overflow-y: auto;
  }
  #back-btn { bottom: auto; top: auto; right: 8px; bottom: 8px; padding: 8px 12px; font-size: 12px; }
  #cam-hint { bottom: 56px; font-size: 10px; max-width: 90vw; text-align: center; }
}
</style>

<script>
// ============================================================
// GLOBAL UI
// ============================================================
const UI_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif";
const UI_TEXT = { fontFamily: UI_FONT, resolution: 2 };

// ============================================================
// PIXEL ART GENERATOR - Procedural sprite generation
// ============================================================
const PixelArt = {
  // Create a pixel texture from a color grid
  createTexture(scene, key, width, height, pixels, scale) {
    scale = scale || WORLD.PIXEL_SCALE || 4;
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    
    if (!pixels || pixels.length !== width * height) {
      console.error('Invalid pixels array for', key, 'expected', width * height, 'got', pixels ? pixels.length : 'null');
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      scene.textures.addCanvas(key, canvas);
      return key;
    }
    
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const color = pixels[y * width + x];
        if (color && color !== 'transparent') {
          ctx.fillStyle = color;
          ctx.fillRect(x * scale, y * scale, scale, scale);
          if (scale >= 3) {
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(x * scale, y * scale, scale, 1);
            ctx.fillRect(x * scale, y * scale, 1, scale);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(x * scale, y * scale + scale - 1, scale, 1);
            ctx.fillRect(x * scale + scale - 1, y * scale, 1, scale);
          }
        }
      }
    }
    
    scene.textures.addCanvas(key, canvas);
    return key;
  },

  fillPixel(ctx, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * size, y * size, size, size);
  },

  // Generate a 16x16 pixel character with head, body, limbs, eyes
  generateCharacter(mainColor) {
    const skin = '#f5d0a9';
    const skinDark = '#e0b890';
    const eyeWhite = '#ffffff';
    const eyeBlack = '#1a1a1a';
    const shoe = '#4a3f35';
    const pants = '#3a3530';
    const t = 'transparent';
    
    // 16x16 grid - each row
    return [
      // Row 0-1: empty
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      // Row 2-3: head top
      t,t,t,t,t,skin,skin,skin,skin,skin,skin,t,t,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      // Row 4-5: head mid (eyes)
      t,t,t,skin,skin,eyeWhite,skin,skin,skin,skin,eyeWhite,skin,skin,t,t,t,
      t,t,t,skin,skin,eyeBlack,skin,skin,skin,skin,eyeBlack,skin,skin,t,t,t,
      // Row 6: mouth
      t,t,t,skin,skin,skin,skin,skinDark,skinDark,skin,skin,skin,skin,t,t,t,
      // Row 7: neck
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      // Row 8-9: body (shirt)
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      // Row 10: body bottom / arms start
      t,t,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,t,t,t,
      // Row 11: arms
      t,t,skin,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,skin,t,t,
      // Row 12: hands / pants top
      t,t,t,t,pants,pants,mainColor,mainColor,mainColor,mainColor,pants,pants,t,t,t,t,
      // Row 13: pants
      t,t,t,t,pants,pants,pants,pants,pants,pants,pants,pants,t,t,t,t,
      // Row 14: legs
      t,t,t,t,pants,pants,t,t,t,t,pants,pants,t,t,t,t,
      // Row 15: shoes
      t,t,t,t,shoe,shoe,t,t,t,t,shoe,shoe,t,t,t,t,
    ];
  },

  // Walking frame 1 (left leg forward)
  generateCharacterWalk1(mainColor) {
    const skin = '#f5d0a9';
    const skinDark = '#e0b890';
    const eyeWhite = '#ffffff';
    const eyeBlack = '#1a1a1a';
    const shoe = '#4a3f35';
    const pants = '#3a3530';
    const t = 'transparent';
    
    return [
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      t,t,t,t,t,skin,skin,skin,skin,skin,skin,t,t,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      t,t,t,skin,skin,eyeWhite,skin,skin,skin,skin,eyeWhite,skin,skin,t,t,t,
      t,t,t,skin,skin,eyeBlack,skin,skin,skin,skin,eyeBlack,skin,skin,t,t,t,
      t,t,t,skin,skin,skin,skin,skinDark,skinDark,skin,skin,skin,skin,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,t,t,t,
      t,t,skin,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,skin,t,t,
      t,t,t,t,pants,pants,mainColor,mainColor,mainColor,mainColor,pants,pants,t,t,t,t,
      t,t,t,t,pants,pants,pants,pants,pants,pants,pants,pants,t,t,t,t,
      t,t,t,pants,pants,t,t,t,t,t,t,pants,pants,t,t,t,
      t,t,shoe,shoe,t,t,t,t,t,t,t,t,shoe,shoe,t,t,
    ];
  },

  // Walking frame 2 (right leg forward)
  generateCharacterWalk2(mainColor) {
    const skin = '#f5d0a9';
    const skinDark = '#e0b890';
    const eyeWhite = '#ffffff';
    const eyeBlack = '#1a1a1a';
    const shoe = '#4a3f35';
    const pants = '#3a3530';
    const t = 'transparent';
    
    return [
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,
      t,t,t,t,t,skin,skin,skin,skin,skin,skin,t,t,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      t,t,t,skin,skin,eyeWhite,skin,skin,skin,skin,eyeWhite,skin,skin,t,t,t,
      t,t,t,skin,skin,eyeBlack,skin,skin,skin,skin,eyeBlack,skin,skin,t,t,t,
      t,t,t,skin,skin,skin,skin,skinDark,skinDark,skin,skin,skin,skin,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,t,t,t,
      t,t,skin,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,skin,t,t,
      t,t,t,t,pants,pants,mainColor,mainColor,mainColor,mainColor,pants,pants,t,t,t,t,
      t,t,t,t,pants,pants,pants,pants,pants,pants,pants,pants,t,t,t,t,
      t,t,t,t,t,pants,pants,t,t,t,t,t,pants,pants,t,t,
      t,t,t,t,t,t,shoe,shoe,t,t,shoe,shoe,t,t,t,t,
    ];
  },

  // Trading/panic frame (arms up)
  generateCharacterExcited(mainColor) {
    const skin = '#f5d0a9';
    const skinDark = '#e0b890';
    const eyeWhite = '#ffffff';
    const eyeBlack = '#1a1a1a';
    const shoe = '#4a3f35';
    const pants = '#3a3530';
    const t = 'transparent';
    
    return [
      t,t,skin,skin,t,t,t,t,t,t,t,t,skin,skin,t,t,
      t,t,skin,skin,t,t,t,t,t,t,t,t,skin,skin,t,t,
      t,t,t,t,t,skin,skin,skin,skin,skin,skin,t,t,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      t,t,t,skin,skin,eyeWhite,skin,skin,skin,skin,eyeWhite,skin,skin,t,t,t,
      t,t,t,skin,skin,eyeBlack,skin,skin,skin,skin,eyeBlack,skin,skin,t,t,t,
      t,t,t,skin,skin,skin,skin,skinDark,skinDark,skin,skin,skin,skin,t,t,t,
      t,t,t,t,skin,skin,skin,skin,skin,skin,skin,skin,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,t,t,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,t,t,t,t,
      t,t,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,t,t,t,
      t,t,skin,skin,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,mainColor,skin,skin,t,t,
      t,t,t,t,pants,pants,mainColor,mainColor,mainColor,mainColor,pants,pants,t,t,t,t,
      t,t,t,t,pants,pants,pants,pants,pants,pants,pants,pants,t,t,t,t,
      t,t,t,t,pants,pants,t,t,t,t,pants,pants,t,t,t,t,
      t,t,t,t,shoe,shoe,t,t,t,t,shoe,shoe,t,t,t,t,
    ];
  },

  generateCharacterSit(mainColor) {
    const pixels = this.generateCharacter(mainColor).slice();
    const shoe = '#4a3f35';
    const pants = '#3a3530';
    const t = 'transparent';
    var seatedRows = [
      [t,t,t,t,pants,pants,pants,pants,pants,pants,pants,pants,t,t,t,t],
      [t,t,t,pants,pants,t,t,t,t,t,t,pants,pants,t,t,t,t],
      [t,t,t,shoe,shoe,t,t,t,t,t,t,shoe,shoe,t,t,t,t],
      [t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t],
      [t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t],
      [t,t,t,t,t,t,t,t,t,t,t,t,t,t,t,t],
    ];
    for (var r = 0; r < 6; r++) {
      for (var c = 0; c < 16; c++) {
        pixels[(10 + r) * 16 + c] = seatedRows[r][c];
      }
    }
    return pixels;
  },

  characters: {

  nearestNode(x, y) {
    let best = null, bestD = Infinity;
    Object.entries(this.nodes).forEach(([id, n]) => {
      const d = (n.x - x) ** 2 + (n.y - y) ** 2;
      if (d < bestD) { bestD = d; best = id; }
    });
    return best;

  findPath(fromId, toId) {
    if (fromId === toId) return [this.nodes[toId]];
    const adj = this._buildEdges();
    const q = [[fromId]];
    const seen = new Set([fromId]);
    while (q.length) {
      const path = q.shift();
      const cur = path[path.length - 1];
      for (const nb of adj[cur] || []) {
        if (seen.has(nb)) continue;
        seen.add(nb);
        const np = path.concat([nb]);
        if (nb === toId) {
          return np.map(id => ({ x: this.nodes[id].x, y: this.nodes[id].y }));
        }
        q.push(np);
      }
    }
    return [this.nodes[toId]];
  },

    return this.findPath(from, to);

  fitCamera() {
    var vw = this.scale.width;
    var vh = this.scale.height;
    var zoom = Math.min(vw / this.WORLD_W, vh / this.WORLD_H) * 0.97;
    this.baseZoom = zoom;
    this.minZoom = zoom * 0.55;
    this.maxZoom = zoom * 1.45;
    this.cameras.main.setZoom(zoom);
    this.cameras.main.centerOn(1200, 720);
  }

  setupCameraControls() {
    var self = this;
    var cam = this.cameras.main;
    this.camDragging = false;
    this.camDidDrag = false;
    this.camDragStart = { x: 0, y: 0 };
    this.camScrollStart = { x: 0, y: 0 };
    this.lastPinchDist = 0;

    this.input.on('wheel', function(pointer, over, deltaX, deltaY) {
      var z = cam.zoom - deltaY * 0.0012;
      cam.zoom = Phaser.Math.Clamp(z, self.minZoom || 0.3, self.maxZoom || 1.5);
    });

    this.input.on('pointerdown', function(pointer) {
      if (pointer.pointerType === 'touch' && self.input.pointer1.isDown && self.input.pointer2.isDown) {
        self.lastPinchDist = Phaser.Math.Distance.Between(
          self.input.pointer1.x, self.input.pointer1.y,
          self.input.pointer2.x, self.input.pointer2.y
        );
      }
    });

    this.input.on('pointermove', function(pointer) {
      if (self.input.pointer1.isDown && self.input.pointer2.isDown) {
        var dist = Phaser.Math.Distance.Between(
          self.input.pointer1.x, self.input.pointer1.y,
          self.input.pointer2.x, self.input.pointer2.y
        );
        if (self.lastPinchDist > 0) {
          cam.zoom = Phaser.Math.Clamp(cam.zoom * (dist / self.lastPinchDist), self.minZoom || 0.3, self.maxZoom || 1.5);
        }
        self.lastPinchDist = dist;
        return;
      }
      if (!self.camDragging || !pointer.isDown) return;
      var dx = pointer.x - self.camDragStart.x;
      var dy = pointer.y - self.camDragStart.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) self.camDidDrag = true;
      cam.scrollX = self.camScrollStart.x - dx / cam.zoom;
      cam.scrollY = self.camScrollStart.y - dy / cam.zoom;
    });

    this.input.on('pointerup', function() {
      self.camDragging = false;
      self.lastPinchDist = 0;
      self.time.delayedCall(50, function() { self.camDidDrag = false; });
    });
  }

  beginCameraDrag(pointer) {
    this.camDragging = true;
    this.camDidDrag = false;
    this.camDragStart = { x: pointer.x, y: pointer.y };
    this.camScrollStart = { x: this.cameras.main.scrollX, y: this.cameras.main.scrollY };
  }

  updateDayNight() {
    var hour = new Date().getHours();
    var alpha = 0;
    if (hour >= 21 || hour < 6) alpha = 0.38;
    else if (hour >= 19) alpha = 0.22;
    else if (hour >= 17) alpha = 0.1;
    if (this.lightingOverlay) this.lightingOverlay.setAlpha(alpha);
    this.isNight = alpha > 0.2;
    Object.values(this.loungeLights || []).forEach(function(l) {
      if (l.boothLight) l.boothLight.setAlpha(l.boothLightBaseAlpha * (alpha > 0.2 ? 1.6 : 1));
    });
  }


  createFloor() {
    var tileSize = 48;
    var cols = Math.ceil(this.WORLD_W / tileSize);
    var rows = Math.ceil(this.WORLD_H / tileSize);
    var mx = ZONE.MID_X, my = ZONE.MID_Y;

    var rt = this.add.renderTexture(0, 0, this.WORLD_W, this.WORLD_H).setOrigin(0, 0).setDepth(0);
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var px = x * tileSize + tileSize / 2;
        var py = y * tileSize + tileSize / 2;
        var key = 'tile_floor';
        if (px < mx && py < my) {
          key = py < 200 ? 'tile_floor_light' : 'tile_floor';
        } else if (px >= mx && py < my) {
          key = 'tile_floor'; // spa - warm
        } else if (px < mx && py >= my) {
          key = 'tile_floor_dark'; // restaurant
        } else {
          key = 'tile_floor_dark'; // casino dark tiles
        }
        rt.draw(key, px, py);
      }
    }
    this.floorRT = rt;
  }

        fontSize: '11px', fontFamily: UI_FONT, color: npc.color, fontStyle: 'bold',
        backgroundColor: 'rgba(250,246,239,0.92)', padding: { x: 4, y: 2 }
      }).setOrigin(0.5).setDepth(4);
      self.npcs.push({ sprite: spr, tag: tag, role: npc.role, baseY: npc.y });
    });
  }

  createCharacters() {
    this.characters = {};
    var agents = [
      { id: 'xau', x: 420, y: 560 },
      { id: 'major', x: 700, y: 560 },
      { id: 'altcoin', x: 980, y: 560 },
      { id: 'newcoin', x: 1260, y: 560 },
      { id: 'momentum', x: 1540, y: 560 },
    ];
    
    var self = this;
    agents.forEach(function(agent) {
      var meta = PixelArt.characters[agent.id];

      sprite.setDepth(3);
      var hitR = 40;

      var hitZone = self.add.zone(agent.x, agent.y, hitR * 2.2, hitR * 2.8);
      hitZone.setDepth(3);
      hitZone.setInteractive({ cursor: 'pointer' });
      
      var nameTag = self.add.text(agent.x, agent.y - 42, meta.name, {

      }).setOrigin(0.5).setDepth(4);
      
      var statusText = self.add.text(agent.x, agent.y + 28, '空闲', {
        fontSize: '11px', fontFamily: UI_FONT, color: '#777'
      }).setOrigin(0.5).setDepth(4);
      
      var pnlText = self.add.text(agent.x, agent.y + 42, '盈亏: --', {
        fontSize: '11px', fontFamily: UI_FONT, color: '#888'
      }).setOrigin(0.5).setDepth(4);
      
      var bubbleText = self.add.text(agent.x, agent.y - 58, '', {
        fontSize: '11px', fontFamily: UI_FONT, color: '#2d2520',
        backgroundColor: 'rgba(255,255,255,0.92)', padding: { x: 6, y: 3 }
      }).setOrigin(0.5).setDepth(5).setAlpha(0);
      
      self.characters[agent.id] = {
        sprite: sprite, hitZone: hitZone, nameTag: nameTag, statusText: statusText, pnlText: pnlText,
        bubbleText: bubbleText, agentId: agent.id, baseX: agent.x, baseY: agent.y,
        pathQueue: [], pathIndex: 0, isWalking: false, destNode: null,
        isResting: false, restPose: 'sit', restUntil: 0, restToggle: 0,
        isMassaging: false, massageUntil: 0,
        isDining: false, dineUntil: 0,
        isPlayingPoker: false, pokerUntil: 0,
        activity: null,
        state: 'idle', animTimer: 0, walkFrame: 0,
        moveTimer: 0, nextMoveTime: 4000 + Math.random() * 6000,
        lastTradeKey: null,
        data: Object.assign({ id: agent.id }, meta)
      };
      
      function onCharClick(pointer) {
        if (pointer && pointer.event) pointer.event.stopPropagation();
        self.showAgentDetail(agent.id);
      }
      sprite.on('pointerdown', onCharClick);
      hitZone.on('pointerdown', onCharClick);
      nameTag.setInteractive({ cursor: 'pointer' });
      nameTag.on('pointerdown', onCharClick);
    });
  }

  createParticles() {
    this.particles = this.add.particles(0, 0, 'particle_up', {
      speed: { min: 20, max: 60 },
      angle: { min: 250, max: 290 },
      scale: { start: 1, end: 0 },
      lifespan: 1000,
      frequency: -1,
      quantity: 1,
      emitting: false
    });
    this.particles.setDepth(5);
  }

  setupInput() {
    var self = this;
    this.selectedAgentId = null;
    
    document.getElementById('detail-close').addEventListener('click', function() {
      document.getElementById('agent-detail').classList.remove('active');
      self.selectedAgentId = null;
    });

    AgentProfile.init();
    
    this.input.on('pointerdown', function(pointer, currentlyOver) {
      if (currentlyOver && currentlyOver.length > 0) {
        var hitChar = currentlyOver.some(function(obj) {
          return Object.values(self.characters).some(function(c) {
            return c.sprite === obj || c.hitZone === obj || c.nameTag === obj;
          });
        });
        if (hitChar) return;
      }
      var wx = pointer.worldX, wy = pointer.worldY;
      var clickedChar = Object.values(self.characters).some(function(c) {
        return Phaser.Math.Distance.Between(wx, wy, c.sprite.x, c.sprite.y) < 48;
      });
      if (clickedChar) return;
      if (!self.camDidDrag) {
        document.getElementById('agent-detail').classList.remove('active');
        self.selectedAgentId = null;
      }
      self.beginCameraDrag(pointer);
    });
  }

  drawDetailAvatar(agentId) {
    var canvas = document.getElementById('detail-avatar');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var tex = this.textures.get('char_' + agentId + '_idle');
    if (tex && tex.getSourceImage) {
      var img = tex.getSourceImage();
      var scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.92;
      var dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
    }
  }

  showAgentDetail(agentId, options) {
    options = options || {};
    var char = this.characters[agentId];
    if (!char) return;
    
    this.selectedAgentId = agentId;
    var meta = PixelArt.characters[agentId] || {};
    var d = char.data || meta;
    
    this.drawDetailAvatar(agentId);
    document.getElementById('detail-icon').textContent = d.icon || meta.icon || '';
    document.getElementById('detail-name').textContent = d.name || meta.name || agentId;
    document.getElementById('detail-desc').textContent = d.desc || meta.desc || '';
    document.getElementById('detail-strategy').textContent = d.strategy || meta.strategy || '--';
    document.getElementById('detail-market').textContent = d.market || meta.market || '--';
    document.getElementById('detail-interval').textContent = d.interval || meta.interval || '--';
    document.getElementById('detail-risk').textContent = d.risk || meta.risk || '--';
    document.getElementById('detail-capital').textContent = d.capital != null ? '$' + Number(d.capital).toLocaleString() : '--';
    
    var pnlEl = document.getElementById('detail-pnl');
    var pnl = d.pnl || 0;
    pnlEl.textContent = d.pnl != null ? (pnl > 0 ? '+' : '') + '$' + Number(pnl).toLocaleString() + ' (' + (d.pnl_pct != null ? d.pnl_pct.toFixed(1) : '0') + '%)' : '--';
    pnlEl.className = pnl > 0 ? 'up' : pnl < 0 ? 'down' : '';
    
    document.getElementById('detail-wr').textContent = d.win_rate != null ? d.win_rate.toFixed(1) + '% (' + (d.wins || 0) + '/' + (d.trades || 0) + ')' : '--';
    
    var status = d.is_circuit_break ? '熔断保护' : d.running ? '运行中' : '离线';
    var statusEl = document.getElementById('detail-status');
    statusEl.textContent = status;
    statusEl.className = d.is_circuit_break ? 'down' : d.running ? 'up' : '';
    
    document.getElementById('detail-pos').textContent = (d.positions ? d.positions.length : 0) + ' 个';
    
    var posDiv = document.getElementById('detail-positions');
    if (d.positions && d.positions.length > 0) {
      posDiv.innerHTML = d.positions.map(function(p) {
        var dirColor = p.direction && p.direction.includes('LONG') ? '#16a34a' : '#dc2626';
        return '<div class="row"><span>' + p.symbol + '</span><span style="color:' + dirColor + '">' + p.direction + '</span></div>';
      }).join('');
    } else {
      posDiv.innerHTML = '<div style="color:#999">无持仓</div>';
    }
    
    document.getElementById('agent-detail').classList.add('active');
    if (!options.refresh) {
      char.sprite.setTint(0xffffcc);
      var self = this;
      this.time.delayedCall(180, function() {
        if (self.characters[agentId]) self.characters[agentId].sprite.clearTint();
      });
      AgentProfile.load(agentId);
    }
  }

  startDataPolling() {
    this.fetchData();
    this.fetchTicker();
    var self = this;
    this.time.addEvent({ delay: 5000, callback: function() { self.fetchData(); }, loop: true });
    this.time.addEvent({ delay: 10000, callback: function() { self.fetchTicker(); }, loop: true });
    this.time.addEvent({ delay: 60000, callback: function() { self.updateDayNight(); }, loop: true });
  }

  fetchData() {
    var self = this;
    var API = location.origin + '/trading';
    fetch(API + '/api/overview')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        self.updateUI(data);
        self.updateCharacters(data.agents);
        if (data.risk) {
          self.updateRiskIndicator(data.risk);
        }
      })
      .catch(function(e) {
        console.error('Data fetch error:', e);
      });
  }

  fetchTicker() {
    var self = this;
    var API = location.origin + '/trading';
    fetch(API + '/api/ticker')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        self.tickerData = data;
        if (data.BTCUSDT) document.getElementById('btc-price').textContent = '$' + data.BTCUSDT.toLocaleString();
        if (data.ETHUSDT) document.getElementById('eth-price').textContent = '$' + data.ETHUSDT.toLocaleString();
        if (data.XAUUSDT) document.getElementById('xau-price').textContent = '$' + data.XAUUSDT.toFixed(2);
        self.updateBigScreenTicker(data);
      })
      .catch(function(e) {});
  }

  updateBigScreenTicker(data) {
    if (!this.tickerTexts || !data) return;
    this.tickerTexts.forEach(function(t) {
      var price = data[t.field];
      if (price == null) {
        t.priceText.setText('--');
        t.priceText.setColor('#888888');
        return;
      }
      var txt;
      if (t.field === 'XAUUSDT') txt = '$' + Number(price).toFixed(2);
      else if (price >= 1000) txt = '$' + Number(price).toLocaleString(undefined, { maximumFractionDigits: 0 });
      else txt = '$' + Number(price).toFixed(2);
      t.priceText.setText(txt);
      t.priceText.setColor('#e8f0ff');
    });
  }

  showTradeBubble(char, trade) {
    if (!trade || !char.bubbleText) return;
    var pct = trade.pnl_pct != null ? trade.pnl_pct : 0;
    var sign = pct >= 0 ? '+' : '';
    var msg = (trade.symbol || '') + ' ' + sign + pct.toFixed(1) + '%';
    char.bubbleText.setText(msg);
    char.bubbleText.setColor(pct >= 0 ? '#16a34a' : '#dc2626');
    char.bubbleText.setAlpha(1);
    char.bubbleText.y = char.sprite.y - 58;
    var self = this;
    this.tweens.killTweensOf(char.bubbleText);
    this.tweens.add({
      targets: char.bubbleText,
      y: char.sprite.y - 88,
      alpha: 0,
      duration: 4200,
      ease: 'Sine.easeOut',
      onComplete: function() { char.bubbleText.setAlpha(0); }
    });
  }

  updateUI(data) {
    var pnl = data.total_pnl || 0;
    var pnlEl = document.getElementById('total-pnl');
    pnlEl.textContent = pnl ? '$' + pnl.toLocaleString() : '--';
    pnlEl.className = pnl > 0 ? 'value up' : pnl < 0 ? 'value down' : 'value';
    
    document.getElementById('win-rate').textContent = data.total_wr ? data.total_wr.toFixed(1) + '%' : '--';
    document.getElementById('runner-status').textContent = data.runner && data.runner.running ? 'RUNNING' : 'STOPPED';
    document.getElementById('runner-status').className = data.runner && data.runner.running ? 'value up' : 'value down';
  }

  updateCharacters(agents) {
    if (!agents) return;
    
    var self = this;
    agents.forEach(function(agent) {
      var char = self.characters[agent.id];
      if (!char) return;
      
      char.data = agent;
      
      var status = agent.is_circuit_break ? '熔断' : 
                   agent.positions && agent.positions.length ? '交易中' :
                   agent.running ? '运行中' : '离线';
      char.statusText.setText(status);
      char.statusText.setColor(agent.is_circuit_break ? '#dc2626' : 
                               agent.positions && agent.positions.length ? '#d97706' :
                               agent.running ? '#16a34a' : '#999');
      
      var pnl = agent.pnl || 0;
      char.pnlText.setText('盈亏: ' + (pnl > 0 ? '+' : '') + '$' + pnl.toLocaleString());
      char.pnlText.setColor(pnl > 0 ? '#16a34a' : pnl < 0 ? '#dc2626' : '#888');
      
      var desk = self.desks[agent.id];
      if (desk) {
        var lightColor = agent.is_circuit_break ? 0xdc2626 :
                          agent.running ? 0x16a34a : 0x999999;
        desk.light.setFillStyle(lightColor);
        desk.agentRunning = !!agent.running;
        desk.agentTrading = !!(agent.positions && agent.positions.length > 0);
        if (agent.running) {
          desk.light.setAlpha(0.5 + Math.sin(self.time.now / 200) * 0.5);
        } else {
          desk.light.setAlpha(1);
        }
      }
      
      if (agent.trades_history && agent.trades_history.length > 0) {
        var latest = agent.trades_history[agent.trades_history.length - 1];
        var tradeKey = latest.symbol + '_' + (latest.opened_at || '') + '_' + (latest.pnl_pct || '');
        if (tradeKey !== char.lastTradeKey && latest.pnl_pct != null) {
          char.lastTradeKey = tradeKey;
          self.showTradeBubble(char, latest);
        }
      }
      
      if (agent.is_circuit_break) {
        char.state = 'panic';
        if (!char.isWalking && !char.isResting) {
          self.assignPathTo(char, 'scr_ctr');
        }
      } else if (agent.positions && agent.positions.length > 0) {
        char.state = 'trading';
        if (!char.isResting && !char.isWalking && Math.random() > 0.92) {
          self.assignPathTo(char, OfficePath.deskByAgent[agent.id]);
        }
      } else if (agent.running) {
        char.state = 'scanning';
      } else {
        char.state = 'idle';
      }
      
      if (Math.abs(pnl) > 100 && Math.random() > 0.7) {
        self.emitPnlParticles(char.sprite.x, char.sprite.y, pnl > 0);
      }
    });
    
    if (self.selectedAgentId) {
      self.showAgentDetail(self.selectedAgentId, { refresh: true });
    }
  }

  updateRiskIndicator(risk) {
    if (risk.circuit_break) {
      this.cameras.main.flash(500, 220, 60, 60, false);
    }
  }

  emitPnlParticles(x, y, isUp) {
    var key = isUp ? 'particle_up' : 'particle_down';
    var emitter = this.add.particles(x, y, key, {
      speed: { min: 30, max: 80 },
      angle: { min: 200, max: 340 },
      scale: { start: 1.5, end: 0 },
      lifespan: 1500,
      quantity: 5,
      emitting: false
    });
    emitter.explode(5);
    emitter.setDepth(5);
  }

  update(time, delta) {
    var self = this;
    
    // Animate characters
    Object.entries(this.characters).forEach(function(entry) {
      self.animateCharacter(entry[1], time, delta);
    });
    
    this.updateDeskScreens(time);
    if (this.npcs) {
      this.npcs.forEach(function(npc) {
        npc.sprite.y = npc.baseY + Math.sin(time / 700) * 1.5;
        npc.tag.y = npc.sprite.y - 40;
      });
    }
    if (Math.floor(time / 30000) !== this._lastDayNightTick) {
      this._lastDayNightTick = Math.floor(time / 30000);
      this.updateDayNight();
    }
  }

  updateDeskScreens(time) {
    Object.values(this.desks).forEach(function(desk) {
      if (!desk.screenBars) return;
      desk.screenBars.forEach(function(bar, i) {
        var h = 6 + Math.abs(Math.sin(time * bar.speed + bar.phase)) * 14;
        if (desk.agentTrading) h += 4 + Math.sin(time * 0.008 + i) * 3;
        bar.rect.setSize(4, h);
        bar.rect.y = 2;
        var color;
        if (desk.agentTrading) {
          color = i % 2 === 0 ? 0x16a34a : 0xdc2626;
        } else if (desk.agentRunning) {
          color = 0x4a90c8;
        } else {
          color = 0x3a5060;
        }
        bar.rect.setFillStyle(color);
      });
      if (desk.scanLine) {
        desk.scanLine.y = -10 + ((time * 0.04) % 24);
        desk.scanLine.setAlpha(desk.agentRunning ? 0.45 : 0.15);
      }
      if (desk.screenCursor) {
        desk.screenCursor.setAlpha(desk.agentRunning && Math.floor(time / 400) % 2 === 0 ? 1 : 0.2);
        desk.screenCursor.x = -26 + ((time * 0.02) % 52);
      }
    });
  }

  assignPathTo(char, nodeId) {
    if (char.isResting || char.isMassaging || char.isDining || char.isPlayingPoker) {
      char.isResting = false;
      char.isMassaging = false;
      char.isDining = false;
      char.isPlayingPoker = false;
      char.activity = null;
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
      this.resetCharDepth(char);
    }
    var pts = OfficePath.pathToNode(char.sprite.x, char.sprite.y, nodeId);
    if (!pts || pts.length < 2) return;
    char.destNode = nodeId;
    char.pathQueue = pts.slice(1);
    char.pathIndex = 0;
    char.isWalking = true;
  }

  onPathComplete(char, time) {
    var node = char.destNode;
    char.destNode = null;
    if (node === OfficePath.boothByAgent[char.agentId]) {
      this.startResting(char, time);
    } else if (node === OfficePath.massageByAgent[char.agentId]) {
      this.startMassaging(char, time);
    } else if (node === OfficePath.dineByAgent[char.agentId]) {
      this.startDining(char, time);
    } else if (node === OfficePath.pokerByAgent[char.agentId]) {
      this.startPlayingPoker(char, time);
    }
  }

  startMassaging(char, time) {
    var bed = this.massageBeds && this.massageBeds[char.agentId];
    char.isMassaging = true;
    char.activity = 'massage';
    char.massageUntil = time + 10000 + Math.random() * 9000;
    char.isWalking = false;
    char.pathQueue = [];
    if (bed) { char.sprite.x = bed.bedX; char.sprite.y = bed.bedY; }
    char.sprite.setDepth(3.2);
    char.nameTag.setDepth(4.5);
    char.statusText.setDepth(4.5);
    char.pnlText.setDepth(4.5);
    char.bubbleText.setDepth(5);
    char.statusText.setText('按摩中');
    char.statusText.setColor('#c87898');
    char.sprite.setTexture('char_' + char.agentId + '_sit');
    char.sprite.setAngle(-90);
    char.sprite.setScale(WORLD.CHAR_SCALE * 0.88);
  }

  startDining(char, time) {
    var seat = this.dineSeats && this.dineSeats[char.agentId];
    char.isDining = true;
    char.activity = 'dine';
    char.dineUntil = time + 9000 + Math.random() * 8000;
    char.isWalking = false;
    char.pathQueue = [];
    if (seat) { char.sprite.x = seat.seatX; char.sprite.y = seat.seatY; }
    char.sprite.setDepth(3.2);
    char.nameTag.setDepth(4.5);
    char.statusText.setDepth(4.5);
    char.pnlText.setDepth(4.5);
    char.bubbleText.setDepth(5);
    char.statusText.setText('就餐中');
    char.statusText.setColor('#b8860b');
    char.sprite.setTexture('char_' + char.agentId + '_sit');
    char.sprite.setAngle(0);
    char.sprite.setScale(WORLD.CHAR_SCALE * 0.92);
  }

  startPlayingPoker(char, time) {
    var seat = this.pokerSeats && this.pokerSeats[char.agentId];
    char.isPlayingPoker = true;
    char.activity = 'poker';
    char.pokerUntil = time + 12000 + Math.random() * 10000;
    char.isWalking = false;
    char.pathQueue = [];
    if (seat) { char.sprite.x = seat.seatX; char.sprite.y = seat.seatY; }
    char.sprite.setDepth(3.2);
    char.nameTag.setDepth(4.5);
    char.statusText.setDepth(4.5);
    char.pnlText.setDepth(4.5);
    char.bubbleText.setDepth(5);
    char.statusText.setText('打德州');
    char.statusText.setColor('#d4af37');
    char.sprite.setTexture('char_' + char.agentId + '_sit');
    char.sprite.setAngle(0);
    char.sprite.setScale(WORLD.CHAR_SCALE * 0.9);
  }

  startResting(char, time) {
    var seat = this.booths && this.booths[char.agentId];
    char.isResting = true;
    char.restUntil = time + 9000 + Math.random() * 8000;
    char.restToggle = time;
    char.restPose = 'sit';
    char.isWalking = false;
    char.pathQueue = [];
    if (seat) {
      char.sprite.x = seat.seatX;
      char.sprite.y = seat.seatY;
    }
    char.sprite.setDepth(3.2);
    char.nameTag.setDepth(4.5);
    char.statusText.setDepth(4.5);
    char.pnlText.setDepth(4.5);
    char.bubbleText.setDepth(5);
    char.statusText.setText('休息中');
    char.statusText.setColor('#6b8e6b');
  }

  resetCharDepth(char) {
    char.sprite.setDepth(3);
    char.nameTag.setDepth(4);
    char.statusText.setDepth(4);
    char.pnlText.setDepth(4);
    char.bubbleText.setDepth(5);
  }

  pickWanderTarget(char) {
    var deskNode = OfficePath.deskByAgent[char.agentId];
    if (char.state === 'trading') return deskNode;
    if (char.state === 'panic') return 'scr_ctr';
    if (char.state === 'idle' && (!char.data || !char.data.running)) {
      var roll = Math.random();
      if (roll > 0.72) return OfficePath.boothByAgent[char.agentId];
      if (roll > 0.52) return OfficePath.massageByAgent[char.agentId];
      if (roll > 0.32) return OfficePath.dineByAgent[char.agentId];
      if (roll > 0.14) return OfficePath.pokerByAgent[char.agentId];
      return deskNode;
    }
    if (char.state === 'scanning' && Math.random() > 0.65) {
      return ['scr_xau','scr_maj','scr_alt','scr_ctr','scr_mom'][Math.floor(Math.random() * 5)];
    }
    if (char.state === 'scanning' && Math.random() > 0.88) {
      var leisure = ['bed_1','dine_2','poker_3','rest_l_2'];
      return leisure[Math.floor(Math.random() * leisure.length)];
    }
    var pool = OfficePath.wanderTargets.filter(function(n) { return n !== deskNode || Math.random() > 0.45; });
    if (Math.random() > 0.4) pool.push(OfficePath.boothByAgent[char.agentId]);
    if (Math.random() > 0.55) pool.push(OfficePath.massageByAgent[char.agentId]);
    if (Math.random() > 0.6) pool.push(OfficePath.dineByAgent[char.agentId]);
    if (Math.random() > 0.65) pool.push(OfficePath.pokerByAgent[char.agentId]);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  animateCharacter(char, time, delta) {
    char.animTimer += delta;

    if (char.isResting) {
      this.animateResting(char, time, delta);
      return;
    }
    if (char.isMassaging) {
      this.animateMassaging(char, time, delta);
      return;
    }
    if (char.isDining) {
      this.animateDining(char, time, delta);
      return;
    }
    if (char.isPlayingPoker) {
      this.animatePoker(char, time, delta);
      return;
    }

    char.moveTimer += delta;

    if (char.state === 'trading' && !char.isWalking && Math.random() > 0.97) {
      this.assignPathTo(char, OfficePath.deskByAgent[char.agentId]);
    }

    if (char.moveTimer > char.nextMoveTime && char.state !== 'panic' && char.state !== 'trading' && !char.isWalking) {
      char.moveTimer = 0;
      char.nextMoveTime = 4500 + Math.random() * 7000;
      this.assignPathTo(char, this.pickWanderTarget(char));
    }

    if (char.state === 'panic' && !char.isWalking) {
      this.assignPathTo(char, 'scr_ctr');
    }

    var agentId = char.agentId;
    var moving = false;
    var dx = 0;

    if (char.isWalking && char.pathQueue.length > 0) {
      var wp = char.pathQueue[char.pathIndex];
      if (wp) {
        dx = wp.x - char.sprite.x;
        var dy = wp.y - char.sprite.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var step = (WORLD.WALK_SPEED * delta) / 1000;
        if (dist <= step || dist < 2) {
          char.sprite.x = wp.x;
          char.sprite.y = wp.y;
          char.pathIndex++;
          if (char.pathIndex >= char.pathQueue.length) {
            char.isWalking = false;
            char.pathQueue = [];
            char.pathIndex = 0;
            this.onPathComplete(char, time);
          }
        } else {
          char.sprite.x += (dx / dist) * step;
          char.sprite.y += (dy / dist) * step;
          moving = true;
        }
      } else {
        char.isWalking = false;
      }
    }

    if (moving) {
      char.walkFrame += delta;
      var frameKey = Math.floor(char.walkFrame / 180) % 2 === 0 ? '_walk1' : '_walk2';
      char.sprite.setTexture('char_' + agentId + frameKey);
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
      if (dx < -0.5) char.sprite.setFlipX(true);
      else if (dx > 0.5) char.sprite.setFlipX(false);
    } else if (char.state === 'trading' || char.state === 'panic') {
      char.sprite.setTexture('char_' + agentId + '_excited');
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
    } else {
      char.sprite.setTexture('char_' + agentId + '_idle');
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE);
      if (char.state === 'idle' || char.state === 'scanning') {
        char.sprite.y += Math.sin(char.animTimer / 500) * 0.8;
      }
    }

    this.syncCharLabels(char);
    this.applyCharTint(char);
    if (char.state === 'trading' && !moving) {
      char.sprite.y += Math.sin(char.animTimer / 150) * 0.8;
    }
  }

  animateResting(char, time, delta) {
    var agentId = char.agentId;
    if (time > char.restUntil) {
      this.endActivity(char, time);
      return;
    }
    if (time - char.restToggle > 4500) {
      char.restToggle = time;
      char.restPose = char.restPose === 'sit' ? 'lie' : 'sit';
    }
    var seat = this.booths && this.booths[char.agentId];
    if (seat) {
      char.sprite.x = seat.seatX;
      char.sprite.y = seat.seatY;
    }
    char.sprite.setDepth(3.2);
    if (char.restPose === 'sit') {
      char.sprite.setTexture('char_' + agentId + '_sit');
      char.sprite.setAngle(0);
      char.sprite.setScale(WORLD.CHAR_SCALE * 0.95);
      char.sprite.setFlipX(false);
      if (seat) char.sprite.y = seat.seatY - 6;
      char.sprite.y += Math.sin(char.animTimer / 800) * 0.4;
    } else {
      char.sprite.setTexture('char_' + agentId + '_sit');
      char.sprite.setAngle(-90);
      char.sprite.setScale(WORLD.CHAR_SCALE * 0.88);
      if (seat) {
        char.sprite.x = seat.seatX + 16;
        char.sprite.y = seat.seatY + 4;
      }
    }
    this.syncCharLabels(char);
    char.sprite.clearTint();
    char.sprite.setAlpha(1);
  }

  endActivity(char, time) {
    char.isResting = false;
    char.isMassaging = false;
    char.isDining = false;
    char.isPlayingPoker = false;
    char.activity = null;
    char.sprite.setAngle(0);
    char.sprite.setScale(WORLD.CHAR_SCALE);
    this.resetCharDepth(char);
    char.moveTimer = 0;
    char.nextMoveTime = 2000 + Math.random() * 3000;
    this.assignPathTo(char, OfficePath.deskByAgent[char.agentId]);
  }

  animateMassaging(char, time, delta) {
    if (time > char.massageUntil) {
      this.endActivity(char, time);
      return;
    }
    var bed = this.massageBeds && this.massageBeds[char.agentId];
    if (bed) { char.sprite.x = bed.bedX; char.sprite.y = bed.bedY; }
    char.sprite.setDepth(3.2);
    char.sprite.setTexture('char_' + char.agentId + '_sit');
    char.sprite.setAngle(-90);
    char.sprite.setScale(WORLD.CHAR_SCALE * 0.88);
    char.sprite.y += Math.sin(char.animTimer / 600) * 0.5;
    this.syncCharLabels(char);
    char.sprite.clearTint();
  }

  animateDining(char, time, delta) {
    if (time > char.dineUntil) {
      this.endActivity(char, time);
      return;
    }
    var seat = this.dineSeats && this.dineSeats[char.agentId];
    if (seat) { char.sprite.x = seat.seatX; char.sprite.y = seat.seatY; }
    char.sprite.setDepth(3.2);
    char.sprite.setTexture('char_' + char.agentId + '_sit');
    char.sprite.setAngle(0);
    char.sprite.setScale(WORLD.CHAR_SCALE * 0.92);
    if (Math.floor(char.animTimer / 800) % 2 === 0) char.sprite.y -= 2;
    this.syncCharLabels(char);
    char.sprite.clearTint();
  }

  animatePoker(char, time, delta) {
    if (time > char.pokerUntil) {
      this.endActivity(char, time);
      return;
    }
    var seat = this.pokerSeats && this.pokerSeats[char.agentId];
    if (seat) { char.sprite.x = seat.seatX; char.sprite.y = seat.seatY; }
    char.sprite.setDepth(3.2);
    char.sprite.setTexture('char_' + char.agentId + '_sit');
    char.sprite.setAngle(0);
    char.sprite.setScale(WORLD.CHAR_SCALE * 0.9);
    char.sprite.y += Math.sin(char.animTimer / 400) * 0.6;
    this.syncCharLabels(char);
    if (Math.random() > 0.992) {
      char.bubbleText.setText('All in!');
      char.bubbleText.setColor('#d4af37');
      char.bubbleText.setAlpha(1);
      var self = this;
      this.time.delayedCall(2000, function() { char.bubbleText.setAlpha(0); });
    }
    char.sprite.clearTint();
  }

  syncCharLabels(char) {
    char.nameTag.x = char.sprite.x;
    char.nameTag.y = char.sprite.y - 44;
    char.hitZone.x = char.sprite.x;
    char.hitZone.y = char.sprite.y;
    char.statusText.x = char.sprite.x;
    char.statusText.y = char.sprite.y + 30;
    char.pnlText.x = char.sprite.x;
    char.pnlText.y = char.sprite.y + 44;
    if (char.bubbleText && char.bubbleText.alpha > 0) {
      char.bubbleText.x = char.sprite.x;
    }
  }

  applyCharTint(char) {
    if (char.isResting || char.isMassaging || char.isDining || char.isPlayingPoker) return;
    if (char.state === 'panic') {
      char.sprite.setTint(0xff6666);
      char.sprite.setAlpha(Math.floor(char.animTimer / 200) % 2 === 0 ? 0.65 : 1);
    } else {
      char.sprite.clearTint();
      char.sprite.setAlpha(1);
    }
  }
}

// ============================================================
// AGENT PROFILE — SOUL + 策略参数编辑
// ============================================================
const AgentProfile = {
  API: location.origin + '/trading',
  currentAgent: null,
  schema: [],
  config: {},

  init() {
    var self = this;
    document.querySelectorAll('#agent-detail .tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { self.switchTab(btn.dataset.tab); });
    });
    document.getElementById('config-save').addEventListener('click', function() { self.saveConfig(); });
    document.getElementById('soul-save').addEventListener('click', function() { self.saveSoul(); });
  },

  switchTab(tab) {
    document.querySelectorAll('#agent-detail .tab-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('tab-overview').classList.toggle('active', tab === 'overview');
    document.getElementById('tab-config').classList.toggle('active', tab === 'config');
    document.getElementById('tab-soul').classList.toggle('active', tab === 'soul');
  },

  load(agentId) {
    var self = this;
    this.currentAgent = agentId;
    this.switchTab('overview');
    document.getElementById('config-msg').textContent = '';
    document.getElementById('soul-msg').textContent = '';
    fetch(this.API + '/api/agent/' + agentId + '/profile')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) return;
        self.schema = (data.schema && data.schema.fields) || [];
        self.config = data.config || {};
        document.getElementById('soul-editor').value = data.soul_md || '';
        self.renderConfigForm();
      })
      .catch(function(e) { console.warn('Profile load failed:', e); });
  },

  renderConfigForm() {
    var form = document.getElementById('config-form');
    if (!this.schema.length) {
      form.innerHTML = '<div style="color:#999;padding:8px 0">该 Agent 暂无可编辑的量化参数</div>';
      return;
    }
    var html = '';
    var cfg = this.config;
    this.schema.forEach(function(f) {
      var val = cfg[f.key] != null ? cfg[f.key] : '';
      var step = f.step ? ' step="' + f.step + '"' : '';
      var min = f.min != null ? ' min="' + f.min + '"' : '';
      var max = f.max != null ? ' max="' + f.max + '"' : '';
      html += '<div class="cfg-field"><label>' + f.label + '</label>';
      html += '<input type="number" name="' + f.key + '" value="' + val + '"' + step + min + max + '></div>';
    });
    form.innerHTML = html;
  },

  saveConfig() {
    var self = this;
    if (!this.currentAgent) return;
    var body = { config: {} };
    this.schema.forEach(function(f) {
      var inp = document.querySelector('#config-form input[name="' + f.key + '"]');
      if (inp && inp.value !== '') body.config[f.key] = inp.value;
    });
    document.getElementById('config-save').disabled = true;
    fetch(this.API + '/api/agent/' + this.currentAgent + '/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('config-save').disabled = false;
        document.getElementById('config-msg').textContent = data.message || (data.ok ? '已保存' : (data.error || '保存失败'));
        document.getElementById('config-msg').style.color = data.ok ? '#16a34a' : '#dc2626';
        if (data.config) self.config = data.config;
      })
      .catch(function() {
        document.getElementById('config-save').disabled = false;
        document.getElementById('config-msg').textContent = '网络错误';
        document.getElementById('config-msg').style.color = '#dc2626';
      });
  },

  saveSoul() {
    var self = this;
    if (!this.currentAgent) return;
    var content = document.getElementById('soul-editor').value;
    document.getElementById('soul-save').disabled = true;
    fetch(this.API + '/api/agent/' + this.currentAgent + '/soul', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('soul-save').disabled = false;
        document.getElementById('soul-msg').textContent = data.message || (data.ok ? '已保存' : (data.error || '保存失败'));
        document.getElementById('soul-msg').style.color = data.ok ? '#16a34a' : '#dc2626';
      })
      .catch(function() {
        document.getElementById('soul-save').disabled = false;
        document.getElementById('soul-msg').textContent = '网络错误';
        document.getElementById('soul-msg').style.color = '#dc2626';
      });
  }
};
